/* ===== the sheet-writing engine ===== */
async function callS(tool,input){ const r=await S.mcp.callTool(SRV,tool,input,{cache:false}); return r?r.payload:null; }
async function sheetVals(id,range){ const p=await callS("get_values",{spreadsheetId:id, range}); return (p&&p.values)||[]; }
async function sheetMeta(id){ const p=await callS("get_spreadsheet",{spreadsheetId:id, fields:["revisionId","sheets.properties.sheetId","sheets.properties.title"]}); const ids={}; for(const s of (p&&p.sheets)||[]) ids[s.properties.title]=s.properties.sheetId; return {rev:p&&p.revisionId, ids}; }
function isStale(e){ return !!e && e.code==="tool_error" && /revision/i.test(String(e.message||"")+" "+JSON.stringify(e.result||"")); }
function outcomeUnknown(e){ return !e || !e.code || ["upstream_error","cancelled","server_unavailable"].includes(e.code); }
const cell=v=>({userEnteredValue:{stringValue:String(v==null?"":v)}});
const rowData=arr=>({values:arr.map(cell)});
function shortTime(stamp){ const m=String(stamp||"").match(/(\d{2}):(\d{2})/); if(!m) return String(stamp||""); let h=+m[1]; const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${m[2]} ${ap}`; }
function mustHave(meta,names){ for(const n of names) if(meta.ids[n]==null) throw {userMsg:`The sheet is missing its “${n}” tab. Nothing was changed.`}; }

async function withLock(name,batchId,fn){
  if(!S.db) return fn();
  const holder=meId()+":"+S.tabId; const ref=S.db.doc("locks/"+name);
  let r; try{ r=await ref.acquire({holder, ttlMs:30000, data:{holderRole:S.role||"", batchId}}); }catch(e){ r={acquired:true}; }
  if(!r.acquired){ let who="Someone"; try{ const d=(await ref.get()).data(); if(d&&d.holderRole) who=roleName(d.holderRole); }catch(e){} throw {busy:true, userMsg:`${who} is saving right now — try again in a moment.`}; }
  const t=setInterval(()=>{ ref.acquire({holder,ttlMs:30000}).catch(()=>{}); },10000);
  try{ return await fn(); } finally{ clearInterval(t); ref.acquire({holder,ttlMs:1000}).catch(()=>{}); }
}
async function runSave(P,fromQueue){
  const res = await withLock(P.list, P.batchId, ()=> P.list==="freezer" ? writePull(P) : writeList(P));
  await afterSave(P,res,fromQueue);
  try{ await S.mcp.invalidate(SRV,"get_values"); }catch(e){}
  return res;
}
async function writeList(P){
  const id=IDS()[P.list]; const tab=listTab(P.list); const prefix=LISTS[P.list].prefix;
  for(let attempt=0; attempt<2; attempt++){
    const meta=await sheetMeta(id); mustHave(meta,[tab,"History","Activity Log"]);
    const [lv,av]=await Promise.all([sheetVals(id,`'${tab}'!A:E`), sheetVals(id,"'Activity Log'!A:X")]);
    const log=av.slice(1).map(r=>pad(r,24));
    const prior=log.filter(r=>r[21]===P.batchId);
    if(prior.length) return replayList(P,prior);
    const rows=lv.slice(1).map((r,i)=>({v:pad(r,5), idx:i+1}));
    const stamp=stampText(new Date());
    const res={added:[],removed:[],skipped:[],events:[]};
    const hist=[], addLog=[], impLog=[], remLog=[], listAdd=[], uidUpd=[], dels=[];
    for(const rm of P.removes){
      const s=rm.seen||{};
      let row = rm.key.startsWith("noid-") ? rows.find(r=>!r.v[4] && rowKey(r.v)===rm.key) : rows.find(r=>r.v[4]===rm.key);
      if(!row){
        if(rm.key.startsWith("noid-")){ res.skipped.push({key:rm.key,item:s.a||"Item",reason:"changed or removed in the sheet since it was checked",kind:"gone"}); continue; }
        const ev=log.filter(r=>r[19]===rm.key && r[2]==="Remove").pop();
        res.skipped.push({key:rm.key,item:s.a||"Item",reason:ev?`already removed by ${ev[3]||"someone"} at ${shortTime(ev[1])}`:"already removed",kind:"gone"}); continue;
      }
      const c=row.v;
      if(c[0]!==(s.a||"")||c[1]!==(s.b||"")||c[2]!==(s.c||"")||c[3]!==(s.d||"")){ res.skipped.push({key:rm.key,item:c[0]||s.a,reason:"changed in the sheet since it was checked",kind:"changed"}); continue; }
      let uid=c[4], orig;
      if(!uid){
        uid=`${prefix}-${uuid()}`; const ie="EVT-"+uuid();
        impLog.push([`Imported: ${c[0]}`,stamp,"Import",P.person,"Imported by Dinner Time site before first tracked change; earlier history unavailable","","" +c[0],"",c[1],"",c[2],"",c[3],"Not yet added","Active",c[0],c[1],c[2],c[3],uid,ie,P.batchId,"",RECORDED_BY]);
        res.events.push(ie); uidUpd.push({idx:row.idx, uid}); orig=[c[0],c[1],c[2],c[3]];
      } else {
        const src=log.filter(r=>r[19]===uid && (r[2]==="Add"||r[2]==="Import")).pop();
        orig = src ? [src[15],src[16],src[17],src[18]] : [c[0],c[1],c[2],c[3]];
      }
      const ev="EVT-"+uuid();
      hist.push([c[0],c[1],c[2],c[3],stamp,P.person,P.note||"",orig[0],orig[1],orig[2],orig[3],uid,ev,P.batchId]);
      remLog.push([`Removed: ${c[0]}`,stamp,"Remove",P.person,P.note||"",c[0],c[0],c[1],c[1],c[2],c[2],c[3],c[3],"Active","Removed",orig[0],orig[1],orig[2],orig[3],uid,ev,P.batchId,"",RECORDED_BY]);
      res.events.push(ev); dels.push(row.idx); res.removed.push({key:rm.key,item:c[0],checkedBy:rm.checkedBy,aisle:rm.aisle});
    }
    for(const ad of P.adds){
      const uid=`${prefix}-${uuid()}`; const ev="EVT-"+uuid(); const day=ad.date||mdyCT(new Date());
      listAdd.push([ad.item,day,ad.notes||"",ad.addedBy,uid]);
      addLog.push([`Added: ${ad.item}`,stamp,"Add",P.person,"","",ad.item,"",day,"",ad.notes||"","",ad.addedBy,"Not yet added","Active",ad.item,day,ad.notes||"",ad.addedBy,uid,ev,P.batchId,"",RECORDED_BY]);
      res.events.push(ev); res.added.push({tempId:ad.tempId,item:ad.item,uid});
    }
    if(!res.events.length) return res;
    const req=[];
    if(LIST_COL()){ for(const r of hist) r.push(LISTS[P.list].logName); for(const r of [...addLog,...impLog,...remLog]) r.push(LISTS[P.list].logName); }
    if(hist.length) req.push({appendCells:{sheetId:meta.ids["History"], rows:hist.map(rowData), fields:"userEnteredValue"}});
    const logRows=[...addLog,...impLog,...remLog];
    if(logRows.length) req.push({appendCells:{sheetId:meta.ids["Activity Log"], rows:logRows.map(rowData), fields:"userEnteredValue"}});
    if(listAdd.length) req.push({appendCells:{sheetId:meta.ids[tab], rows:listAdd.map(rowData), fields:"userEnteredValue"}});
    for(const u of uidUpd) req.push({updateCells:{start:{sheetId:meta.ids[tab], rowIndex:u.idx, columnIndex:4}, rows:[rowData([u.uid])], fields:"userEnteredValue"}});
    dels.sort((a,b)=>b-a).forEach(i=>req.push({deleteDimension:{range:{sheetId:meta.ids[tab], dimension:"ROWS", startIndex:i, endIndex:i+1}}}));
    try{ await callS("update_spreadsheet",{spreadsheetId:id, requests:req, writeControl:{requiredRevisionId:meta.rev}}); }
    catch(e){
      if(isStale(e)){ if(attempt===0) continue; throw {userMsg:"The sheet changed while saving — nothing was written."}; }
      if(outcomeUnknown(e)){ const v=await sheetVals(id,"'Activity Log'!V:V").catch(()=>[]); if(!v.some(r=>r[0]===P.batchId)) throw {userMsg:"Nothing was changed. Your checks are still here."}; }
      else throw accessFail(e);
    }
    const ue=new Set((await sheetVals(id,"'Activity Log'!U:U")).map(r=>r[0]));
    if(!res.events.every(x=>ue.has(x))) throw {userMsg:"The save couldn't be confirmed in the sheet. Try again; nothing will be written twice."};
    return res;
  }
}
function replayList(P,prior){
  const res={added:[],removed:[],skipped:[],events:[],replayed:true};
  for(const r of prior){ if(r[2]==="Add") res.added.push({item:r[6]}); if(r[2]==="Remove"){ const rm=P.removes.find(x=>x.key===r[19]) || P.removes.find(x=>(x.seen||{}).a===r[5]); res.removed.push({key:rm?rm.key:r[19], item:r[5], checkedBy:rm&&rm.checkedBy, aisle:rm&&rm.aisle}); } }
  // a removed noid row now has a UID; map remaining removes as handled
  for(const rm of P.removes) if(!res.removed.find(x=>x.key===rm.key) && rm.key.startsWith("noid-")) res.removed.push({key:rm.key,item:(rm.seen||{}).a,checkedBy:rm.checkedBy});
  return res;
}
async function writePull(P){
  const id=IDS().freezer;
  for(let attempt=0; attempt<2; attempt++){
    const meta=await sheetMeta(id); mustHave(meta,["Inventory","Change Log","Confirmed Withdrawals"]);
    const [inv,cw]=await Promise.all([sheetVals(id,"'Inventory'!A:O"), sheetVals(id,"'Confirmed Withdrawals'!A:I")]);
    const prior=cw.slice(1).map(r=>pad(r,9)).filter(r=>r[0]===P.batchId);
    if(prior.length) return {pulled:prior.map(r=>({id:r[3],item:r[4]})), skipped:[], replayed:true};
    const rows=inv.slice(1).map((r,i)=>({v:pad(r,15), idx:i+1}));
    const now=new Date(); const today=mdyCT(now); const iso=isoCT(now); const serial=serialToday();
    const res={pulled:[],skipped:[]}; const req=[]; const chg=[], cwr=[];
    const invId=meta.ids["Inventory"];
    for(const pk of P.pulls){
      const row=rows.find(r=>r.v[0]===pk.id);
      if(!row){ res.skipped.push({item:pk.item,reason:"no longer in the inventory",key:pk.id,kind:"gone"}); continue; }
      if(row.v[3].trim().toLowerCase()!=="in freezer"){ res.skipped.push({item:row.v[1],reason:`status is now ${row.v[3]||"blank"}`,key:pk.id,kind:"gone"}); continue; }
      const item=row.v[1], label=row.v[4];
      const notes=`Withdrawal batch ${P.batchId}; pulled from Dinner Time site by ${P.person}; ${item} dated ${label||"undated"}.`+(P.note?` ${P.note}`:"");
      req.push({updateCells:{start:{sheetId:invId,rowIndex:row.idx,columnIndex:3}, rows:[rowData(["Removed to thaw"])], fields:"userEnteredValue"}});
      req.push({updateCells:{start:{sheetId:invId,rowIndex:row.idx,columnIndex:11}, rows:[{values:[{userEnteredValue:{numberValue:serial}, userEnteredFormat:{numberFormat:{type:"DATE",pattern:"MM/dd/yyyy"}}}]}], fields:"userEnteredValue,userEnteredFormat.numberFormat"}});
      req.push({updateCells:{start:{sheetId:invId,rowIndex:row.idx,columnIndex:12}, rows:[rowData([P.person])], fields:"userEnteredValue"}});
      req.push({updateCells:{start:{sheetId:invId,rowIndex:row.idx,columnIndex:14}, rows:[rowData([notes])], fields:"userEnteredValue"}});
      chg.push([today,pk.id,"Removed to thaw","In freezer","Removed to thaw",P.person,`Withdrawal batch ${P.batchId}; ${item} dated ${label||"undated"}.`]);
      cwr.push([P.batchId,iso,P.person,pk.id,item,"1 package",label,"unspecified","pending"]);
      res.pulled.push({id:pk.id,item,checkedBy:pk.checkedBy});
    }
    if(!res.pulled.length) return res;
    req.push({appendCells:{sheetId:meta.ids["Change Log"], rows:chg.map(rowData), fields:"userEnteredValue"}});
    req.push({appendCells:{sheetId:meta.ids["Confirmed Withdrawals"], rows:cwr.map(rowData), fields:"userEnteredValue"}});
    try{ await callS("update_spreadsheet",{spreadsheetId:id, requests:req, writeControl:{requiredRevisionId:meta.rev}}); }
    catch(e){
      if(isStale(e)){ if(attempt===0) continue; throw {userMsg:"The sheet changed while saving — nothing was written."}; }
      if(outcomeUnknown(e)){ const v=await sheetVals(id,"'Confirmed Withdrawals'!A:A").catch(()=>[]); if(!v.some(r=>r[0]===P.batchId)) throw {userMsg:"Nothing was changed. Your selections are still here."}; }
      else throw accessFail(e);
    }
    const v=await sheetVals(id,"'Confirmed Withdrawals'!A:A");
    if(v.filter(r=>r[0]===P.batchId).length<res.pulled.length) throw {userMsg:"The pull couldn't be confirmed in the sheet. Try again; nothing will be written twice."};
    return res;
  }
}
function accessFail(e){
  const c=e&&e.code; noteAccessError(e);
  const m={needs_reauth:"Reconnect Google Sheets in Claude Settings → Connectors, then try again. Nothing was changed.", server_not_connected:"Add Google Sheets in Claude Settings → Connectors. Nothing was changed.", approval_required:"Google Sheets needs your OK first. Nothing was changed.", not_in_manifest:"Google Sheets is turned off for this page. Nothing was changed.", tool_error:"Google Sheets refused the change: "+String(e&&e.message||"").slice(0,160)};
  return {userMsg:m[c]||"Nothing was changed. Your checks are still here."};
}
async function afterSave(P,res,fromQueue){
  const n=(res.added||[]).length+(res.removed||[]).length+(res.pulled||[]).length;
  const sk=res.skipped||[];
  // trip summary
  let trip=null;
  if(P.list!=="freezer" && n){
    const firsts=(P.removes||[]).map(r=>r.checkedAt).filter(Boolean);
    const byRole={}; for(const r of res.removed){ const ro=roleOf(r.checkedBy); if(ro) byRole[ro]=(byRole[ro]||0)+1; }
    const aisles=P.list==="shopping"?[...new Set(res.removed.map(r=>r.aisle).filter(Boolean))].sort((a,b)=>AISLES.indexOf(a)-AISLES.indexOf(b)):[];
    trip={count:n, minutes:firsts.length?Math.max(1,Math.round((Date.now()-Math.min(...firsts))/60000)):null, aisles, byRole};
  }
  const journal={list:P.list, by:meId(), role:P.role, status:sk.length?(n?"partial":"skipped"):"done", counts:{added:(res.added||[]).length, removed:(res.removed||[]).length+(res.pulled||[]).length, skipped:sk.length}, skipped:sk.map(s=>({item:s.item,reason:s.reason})), at:Date.now(), trip};
  if(S.db){
    await dbWrite("saves/"+P.batchId,"set",journal);
    if(P.list==="freezer"){
      for(const p of res.pulled||[]) await dbWrite(checkPath("freezer",p.id),"delete");
      for(const s of sk) if(s.kind==="gone") await dbWrite(checkPath("freezer",s.key),"delete");
    } else {
      for(const r of res.removed||[]) if(r.key){ delete S.checks[P.list][r.key]; await dbWrite(checkPath(P.list,r.key),"delete"); }
      for(const s of sk) if(s.kind==="gone"){ delete S.checks[P.list][s.key]; await dbWrite(checkPath(P.list,s.key),"delete"); }
      const added=new Set((res.added||[]).map(a=>a.tempId));
      for(const a of P.adds||[]) if(added.has(a.tempId)||res.replayed){ delete S.pending[P.list][a.tempId]; await dbWrite(`lists/${P.list}/pending/${a.tempId}`,"delete"); }
    }
  }
}

/* ===== fallback queue: a page with Sheets access applies saves from pages without it ===== */
let qBusy=false, qTimer=0;
async function processQueue(){
  if(qBusy||S.access!=="ok"||!S.db||!S.role||S.working) return;
  const next=Object.values(S.queue).filter(q=>q.status==="waiting").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0))[0];
  if(!next) return;
  qBusy=true;
  const ref=S.db.doc("saveQueue/"+next._id);
  try{
    await ref.update({status:"applying", applyingBy:meId(), applyingAt:Date.now()});
    const res=await runSave(next.payload,true);
    const n=(res.added||[]).length+(res.removed||[]).length+(res.pulled||[]).length;
    await ref.update({status:"done", doneAt:Date.now(), result:{added:(res.added||[]).length, removed:(res.removed||[]).length+(res.pulled||[]).length, skipped:(res.skipped||[]).map(s=>({item:s.item,reason:s.reason}))}});
    if(n) toast(`${roleName(next.role)}'s save is now in the sheet.`);
  }catch(e){
    if(e&&e.busy){ try{ await ref.update({status:"waiting"}); }catch(_){} clearTimeout(qTimer); qTimer=setTimeout(processQueue,20000); }
    else { try{ await ref.update({status:"failed", result:{message:(e&&e.userMsg)||"the sheet refused it"}}); }catch(_){} }
  }finally{ qBusy=false; setTimeout(processQueue,500); }
}

const watches=[];
function noteAccessError(e){
  const c=e&&e.code; S.accessCode=c||null;
  const map={server_not_connected:"none", server_not_found:"none", not_granted:"none", capability_disabled:"none", capability_removed:"none", blocked_by_policy:"none", needs_reauth:"reauth", approval_required:"approval", not_in_manifest:"off", selection_required:"select", server_unavailable:"down", upstream_error:"down", rate_limited:"down"};
  const st=map[c]; if(st){ S.access=st; render(); }
}
let connecting=false, lastConnect=0;
async function connectSheets(userAsked){
  if(!S.mcp){ S.access="none"; render(); return; }
  if(connecting) return; connecting=true; lastConnect=Date.now();
  if(userAsked){ S.access="checking"; render(); }
  try{
    const sig=(typeof AbortSignal!=="undefined"&&AbortSignal.timeout)?AbortSignal.timeout(20000):undefined;
    await S.mcp.callTool(SRV,"get_spreadsheet",{spreadsheetId:IDS().shopping, fields:["spreadsheetId"]},sig?{cache:false,signal:sig}:{cache:false});
    S.access="ok"; S.accessCode=null; startWatches(); render(); processQueue();
  }catch(e){
    if(e&&e.retryable&&!userAsked){ setTimeout(()=>{ connecting=false; connectSheets(true); },Math.min(60000,e.retryAfterMs||3000+Math.random()*2000)); connecting=false; noteAccessError(e); return; }
    noteAccessError(e); if(!S.access||S.access==="checking") S.access="down"; render();
    if(S.access==="down"){ clearTimeout(connectSheets._t); connectSheets._t=setTimeout(()=>{ if(S.access!=="ok") connectSheets(false); },15000); }
  }finally{ connecting=false; }
}
function startWatches(){

  if(watches.length) return;
  const ids=IDS();
  const reg=(list,id,range,width)=>watches.push(S.mcp.watchTool(SRV,"get_values",{spreadsheetId:id, range},ev=>{
    if(ev.type==="data"){

      const c=ev.error&&ev.error.code;
      if(["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","not_granted"].includes(c)){ S.live[list]=null; }
      S.liveErr[list]=c; noteAccessError(ev.error); render();
    }
  },{refetchInterval:60000}));
  reg("shopping",ids.shopping,`'${listTab("shopping")}'!A:E`,5);
  reg("extra",ids.extra,`'${listTab("extra")}'!A:E`,5);
  reg("freezer",ids.freezer,"'Inventory'!A:O",15);
}

const lastSnapHash={};
async function saveSnapshot(list,rows,at){
  if(!S.db) return; const h=hash(JSON.stringify(rows));

  if(cur && hash(JSON.stringify(cur.rows||[]))===h){ lastSnapHash[list]=h; return; }
  lastSnapHash[list]=h;
  await dbWrite("snapshots/"+list,"set",{rows, readAt:at, readBy:meId(), mode:CONFIG.MODE});
}

/* ---------------- shared db subscriptions ---------------- */
function startDb(){
  const db=S.db; let first=true;
  const timer=setTimeout(()=>{ if(!S.dbReady){ S.dbSlow=true; render(); } },10000);
  const ready=()=>{ if(first){ first=false; } clearTimeout(timer); S.dbReady=true; S.dbSlow=false; };
  const err=e=>{ clearTimeout(timer); S.dbSlow=false; if(e&&e.code==="revoked"){ S.dbReadOnly=true; } render(); };
  db.collection("people").onSnapshot(s=>{ ready(); const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&PERSON[x.role]) m[d.id]=x.role; }); S.people=m; resolveRole(); render(); },err);
  for(const l of ["shopping","extra","freezer"]) db.collection(`lists/${l}/checks`).onSnapshot(s=>{ ready(); const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x) m[x.key||d.id]=x; }); S.checks[l]=m; render(); roomPresence(); if(!s.metadata.fromCache) outboxFlush(); },err);
  for(const l of ["shopping","extra"]) db.collection(`lists/${l}/pending`).onSnapshot(s=>{ ready(); const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&x.item) m[d.id]=x; }); const before=Object.keys(S.pending[l]).length; S.pending[l]=m; if(Object.keys(m).length>before && !first) Hero.sprout(); render(); },err);
  db.collection("aisles").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]=d.data(); }); S.aisles=m; render(); },err);
  db.collection("snapshots").onSnapshot(s=>{ ready(); const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&Array.isArray(x.rows)&&(!x.mode||x.mode===CONFIG.MODE)) m[d.id]=x; }); S.snaps=m; render(); },err);
  db.collection("saves").orderBy("at","desc").limit(5).onSnapshot(s=>{ const prevTop=S.saves[0]&&S.saves[0]._id; S.saves=s.docs.map(d=>({_id:d.id,...d.data()})); const top=S.saves[0];
    if(top && prevTop && top._id!==prevTop && top.role!==S.role){ const n=(top.counts&&((top.counts.added||0)+(top.counts.removed||0)))||0; if(n){ toast(`${roleName(top.role)} saved ${n} ${n===1?"item":"items"}.`); if(top.list==="freezer") Hero.mist(); else Hero.fold(); } }
    render(); },err);
  db.collection("saveQueue").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ m[d.id]={_id:d.id,...d.data()}; }); S.queue=m; render(); processQueue(); },err);
}

/* ---------------- identity ---------------- */
function applyRole(r){ S.role=r; document.documentElement.dataset.role=r||""; lsSet("dt.role",r); render(); roomPresence(); }
async function resolveRole(){
  if(S.uid){
    const known=S.people[S.uid];
    if(known){ if(known!==S.role) applyRole(known); closeWelcomeIfOpen(); return; }
    if(S.isOwner){ applyRole(OWNER); if(!S.writingPeople){ S.writingPeople=true; await dbWrite("people/"+safeSeg(S.uid),"set",{role:OWNER}); } return; }
    if(S.dbReady) showWelcome();
  } else {
    const r=lsGet("dt.role",null); if(r&&PERSON[r]) applyRole(r); else if(S.isOwner) applyRole(OWNER); else showWelcome();
  }
}

/* =====================================================================
   Recipes — reads 'Dinner Time – Recipes'; per-person 1–5 star ratings
   are written to its Ratings tab. Photos are pre-shrunk copies stored
   with this page (RECIPE_IMG, keyed by Drive file ID); anything else
   is fetched once from Google Drive, else a lettered placeholder.
   ===================================================================== */
const RECIPES_SHEET = DT.sheets.recipes;
const DRIVE_SRV = "Google Drive";
const RECIPE_IMG = /*RECIPE_IMG*/{}/*END_RECIPE_IMG*/;
const RX = { recipes:null, links:null, cats:null, ratings:null, snap:null, snapParts:{}, queue:{}, rqBusy:false, err:null, q:"", cat:"all", sort:"az", openId:null, pendingRate:{}, img:{}, imgBusy:{}, editQ:{}, applied:{}, eqBusy:false };
const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.6l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z"/></svg>';
I.book = '<path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v15H5.5A1.5 1.5 0 0 0 4 20.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v15h5.5a1.5 1.5 0 0 1 1.5 1.5z"/>';

function rxSrc(){ if(RX.recipes&&RX.links&&RX.cats&&RX.ratings) return {recipes:RX.recipes,links:RX.links,cats:RX.cats,ratings:RX.ratings}; return RX.snap; }
function rxData(){
  let src=rxSrc(); if(!src||!src.recipes) return null; src=rxApplyEdits(src);
  const catName={}; for(const c of src.cats||[]) if(c[0]) catName[c[0]]=c[1]||"";
  const byRecipe={}; for(const l of src.links||[]){ if(!l[1]||!l[2]) continue; (byRecipe[l[1]]=byRecipe[l[1]]||[]).push(catName[l[2]]||""); }
  const rat={}; for(const r of src.ratings||[]){ const id=r[1], who=String(r[2]||"").trim().toLowerCase(); const n=parseFloat(r[3]); if(!id||!(n>=1&&n<=5)) continue; (rat[id]=rat[id]||{})[who]={stars:Math.round(n), note:r[4]||"", rowId:r[0]}; }
  for(const q of Object.values(RX.queue)){ if(q&&q.id&&PERSON[q.role]&&q.stars>=1&&q.stars<=5) (rat[q.id]=rat[q.id]||{})[q.role]={stars:q.stars, note:q.note||""}; }
  for(const [k,v] of Object.entries(RX.pendingRate)){ const [id,who]=k.split("|"); (rat[id]=rat[id]||{})[who]={...(rat[id]&&rat[id][who]||{}), stars:v.stars, note:v.note}; }
  const list=src.recipes.filter(r=>r[0]&&r[1]).map(r=>{
    const cats=(byRecipe[r[0]]||[]).filter(Boolean).sort();
    const rs=rat[r[0]]||{}; const vals=Object.values(rs).map(x=>x.stars);
    return {id:r[0], name:r[1], text:r[2]||"", ing:r[7]||"", ingFrom:r[8]||"", img:r[6]||r[3]||"", cats, ratings:rs, pending:!!RX.editQ[r[0]], avg:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null};
  });
  const counts={}; for(const x of list) for(const c of x.cats) counts[c]=(counts[c]||0)+1;
  return {list, counts};
}
function starsHTML(v){ if(v==null) return ""; const r=Math.round(v); let h=""; for(let i=1;i<=5;i++) h+=`<span class="${i<=r?"":"off"}">${STAR}</span>`; return `<span class="stars" aria-hidden="true">${h}</span>`; }
function rxImg(fid, eager){
  if(!fid) return null;
  if(isPhotoUrl(fid)) return fid;
  if(RECIPE_IMG[fid]) return RECIPE_IMG[fid];
  const c=RX.img[fid]; if(c) return c==="none"?null:c;
  if(eager) driveImg(fid); return null;
}
async function driveImg(fid){
  if(!fid||isPhotoUrl(fid)||RX.imgBusy[fid]||RX.img[fid]||!S.mcp) return; RX.imgBusy[fid]=true;
  try{
    const r=await S.mcp.callTool(DRIVE_SRV,"download_file_content",{fileId:fid});
    let p=r&&r.payload; if(typeof p==="string"){ try{ p=JSON.parse(p); }catch(e){} }
    const b64=p&&p.content; if(!b64) throw 0;
    const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    RX.img[fid]=URL.createObjectURL(new Blob([u],{type:(p.mimeType&&/^image\//.test(p.mimeType))?p.mimeType:"image/jpeg"}));
  }catch(e){ RX.img[fid]="none"; }
  finally{ RX.imgBusy[fid]=false; render(); if(RX.openId) refreshRecipeSheet(); }
}
function imgBox(x,cls,eager){
  const src=rxImg(x.img, eager);
  return `<div class="${cls}">${src?`<img src="${esc(src)}" alt="" loading="${eager?"eager":"lazy"}" decoding="async">`:`<div class="rx-ph" aria-hidden="true">${esc((x.name.match(/[A-Za-z0-9]/)||["·"])[0].toUpperCase())}</div>`}</div>`;
}
function renderRecipes(){
  const host=document.getElementById("list-recipes"); const d=rxData();
  const cnt=document.getElementById("rx-count");
  if(!d){
    if(cnt) cnt.textContent="";
    host.innerHTML = (S.access!=="ok"&&S.access!=="checking"&&S.dbReady) ? `<div class="banner warn">${icon("book",20)}<div class="b-body">The recipes show up here once a phone that can reach the recipe sheet opens Dinner Time!. After that they stay here for both of you.</div></div>` : RX.err ? `<div class="banner warn">${icon("alert",20)}<div class="b-body">Can't read the recipe sheet right now. Try again in a moment.</div></div>` : `<div class="rx-grid"><div class="skel" style="height:200px"></div><div class="skel" style="height:200px"></div><div class="skel" style="height:200px"></div><div class="skel" style="height:200px"></div></div>`;
    return;
  }

  const q=RX.q.trim().toLowerCase();
  let items=d.list.filter(x=>(RX.cat==="all"||x.cats.includes(RX.cat)) && (!q || x.name.toLowerCase().includes(q) || x.cats.some(c=>c.toLowerCase().includes(q)) || x.text.toLowerCase().includes(q)));
  if(RX.sort==="top") items.sort((a,b)=>(b.avg||0)-(a.avg||0)||a.name.localeCompare(b.name)); else items.sort((a,b)=>a.name.localeCompare(b.name));
  const cats=Object.keys(d.counts).sort((a,b)=>d.counts[b]-d.counts[a]||a.localeCompare(b));
  const chips=document.getElementById("rx-chips");
  chips.innerHTML=[`<button class="rx-chip" type="button" data-cat="all" aria-pressed="${RX.cat==="all"}">All<span class="n">${d.list.length}</span></button>`,...cats.map(c=>`<button class="rx-chip" type="button" data-cat="${esc(c)}" aria-pressed="${RX.cat===c}">${esc(c)}<span class="n">${d.counts[c]}</span></button>`)].join("");
  document.querySelectorAll("#rx-seg [data-sort]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sort===RX.sort)));
  if(!items.length){ host.innerHTML=`<p class="rx-empty">No recipes match${q?` “${esc(RX.q)}”`:""}.</p>`; return; }
  host.innerHTML=`<div class="rx-grid">${items.map(x=>{

/* ===== Dinner ideas: recipes for what came out of the freezer =====

const TN = { wk:null, cw:null, err:null, sel:null, open:false };

    } else { TN.err=(ev.error&&ev.error.code)||"error"; render(); }

function tnTime(s){

function tnTrim(rows){ const out=[]; let n=2; for(let i=rows.length-1;i>=0;i--){ const k=JSON.stringify(rows[i]).length+1; if(n+k>180000) break; n+=k; out.unshift(rows[i]); } return out; }

  for(const r of CW||[]){ const b=get(r[0]); b.t=Math.max(b.t,tnTime(r[1])); b.by=b.by||r[2]; b.items.push({pkg:r[3],item:r[4],status:r[8]}); }

    .filter(b=>!(b.items.length && !b.recipes.length && b.items.every(i=>/^not needed/i.test(i.status))))

let rxSnapHash="", rxSnapT=0;

}

/* ---------- recipe create / edit / delete ----------
   Every change is first written to the shared queue rxEditQueue/<RecipeID>
   (latest version of that recipe wins), so both phones see it at once.
   A phone that can reach the recipe sheet (or the hourly run) then writes it:
   Recipes row (A id, B name, C instructions, D Drive image, E updated,
   F by, G app photo url), its RecipeCategories rows, and on delete its
   Ratings rows too. */
const RX_APPLIED_MS = 5*60*1000;
function isPhotoUrl(v){ return /^(\/_blob\/|https?:|blob:)/.test(String(v||"")); }
function rxEdits(){
  const out={};
  for(const [id,e] of Object.entries(RX.applied)){ if(Date.now()-e.t<RX_APPLIED_MS) out[id]=e; else delete RX.applied[id]; }
  for(const [id,e] of Object.entries(RX.editQ)) if(!out[id]||(e.at||0)>=(out[id].at||0)) out[id]=e;
  return Object.values(out).sort((a,b)=>(a.at||0)-(b.at||0));
}
function rxApplyEdits(src){
  const edits=rxEdits(); if(!edits.length) return src;
  let recipes=src.recipes.map(r=>r.slice()), links=src.links.slice();
  for(const e of edits){
    if(!e||!e.id) continue;
    links=links.filter(l=>l[1]!==e.id);
    if(e.op==="delete"){ recipes=recipes.filter(r=>r[0]!==e.id); continue; }
    let r=recipes.find(r=>r[0]===e.id);
    if(!r){ r=[e.id,"","","","","","","",""]; recipes.push(r); }
    while(r.length<9) r.push("");
    r[1]=e.name||""; r[2]=e.text||"";
    if(e.photo!=null){ r[6]=e.photo; if(e.photo==="") r[3]=""; }
    for(const c of e.cats||[]) links.push([e.id+"_"+c,e.id,c]);
  }
  return {...src, recipes, links};
}
/* forget applied edits once the sheet data shows them */
function rxPruneApplied(){
  const src=rxSrc(); if(!src||!src.recipes) return;
  for(const [id,e] of Object.entries(RX.applied)){
    const r=src.recipes.find(r=>r[0]===id);
    const done = e.op==="delete" ? !r : (r && r[1]===(e.name||"") && r[2]===(e.text||""));
    if(done) delete RX.applied[id];
  }
}
function newRecipeId(){
  const have=new Set(((rxSrc()||{}).recipes||[]).map(r=>r[0]));
  for(;;){ const a=new Uint8Array(4); crypto.getRandomValues(a); const id=[...a].map(b=>b.toString(16).padStart(2,"0")).join(""); if(!have.has(id)&&!RX.editQ[id]) return id; }
}
function canEditRecipes(){ return !!S.role && ((S.db&&!S.dbReadOnly) || (S.access==="ok"&&S.mcp)); }

let editChain=Promise.resolve();
function queueRecipeEdit(e){
  if(!S.role){ showWelcome(); return Promise.resolve(false); }
  e={...e, by:S.role, at:Date.now()};
  const prev=RX.editQ[e.id];
  // a new recipe that hasn't reached the sheet yet stays a "create"
  if(prev&&prev.op==="create"&&e.op==="update") e.op="create";
  const direct=S.access==="ok"&&S.mcp;
  if(S.db&&!S.dbReadOnly){
    if(prev&&prev.op==="create"&&e.op==="delete"&&!RX.applied[e.id]){
      // never reached the sheet: just drop it
      delete RX.editQ[e.id]; render();
      return editChain=editChain.then(()=>dbWrite("rxEditQueue/"+e.id,"delete")).then(()=>true);
    }
    RX.editQ[e.id]=e; render();
    return editChain=editChain.then(()=>dbWrite("rxEditQueue/"+e.id,"set",e)).then(ok=>{
      if(!ok){ if(RX.editQ[e.id]===e){ if(prev) RX.editQ[e.id]=prev; else delete RX.editQ[e.id]; } render(); toast("That didn't save. Try again.",4000); return false; }
      if(!direct) toast(e.op==="delete"?"Deleted. The recipe sheet catches up within the hour.":"Saved. The recipe sheet catches up within the hour.",4500);
      processEditQueue(); return true;
    });
  }
  if(!direct){ toast("Sign in to Claude to change recipes."); return Promise.resolve(false); }
  RX.applied[e.id]={...e,t:Date.now()}; render();
  return editChain=editChain.then(()=>writeRecipeEdit(e)).then(()=>true).catch(err=>{ delete RX.applied[e.id]; render(); toast((err&&err.userMsg)||"That didn't save. Try again.",4000); return false; });
}
async function processEditQueue(){
  if(RX.eqBusy||S.access!=="ok"||!S.mcp||!S.db) return;
  const next=Object.values(RX.editQ).sort((a,b)=>(a.at||0)-(b.at||0))[0]; if(!next) return;
  RX.eqBusy=true;
  try{
    await writeRecipeEdit(next);
    RX.applied[next.id]={...next,t:Date.now()};
    const cur=RX.editQ[next.id];
    if(cur&&cur.at===next.at){ delete RX.editQ[next.id]; await dbWrite("rxEditQueue/"+next.id,"delete"); }
    if(next.by===S.role) toast(next.op==="delete"?"Deleted from the recipe sheet.":next.op==="create"?"Added to the recipe sheet.":"Recipe sheet updated.");
  }catch(e){ console.warn("recipe sync failed",e); RX.eqBusy=false; if(e&&e.userMsg) toast(e.userMsg,4000); return; }
  RX.eqBusy=false; render(); setTimeout(processEditQueue,300);
}
async function writeRecipeEdit(e){
  const who=roleName(e.by||S.role)||"Dinner Time!";
  for(let attempt=0; attempt<2; attempt++){
    const meta=await sheetMeta(RECIPES_SHEET); mustHave(meta,["Recipes","RecipeCategories","Ratings"]);
    const [ids,links,rates]=await Promise.all([sheetVals(RECIPES_SHEET,"'Recipes'!A:A"),sheetVals(RECIPES_SHEET,"'RecipeCategories'!A:C"),sheetVals(RECIPES_SHEET,"'Ratings'!B:B")]);
    const sR=meta.ids["Recipes"], sL=meta.ids["RecipeCategories"], sT=meta.ids["Ratings"];
    const idx=ids.findIndex((r,i)=>i>0&&r&&r[0]===e.id);
    const linkIdx=[]; links.forEach((r,i)=>{ if(i>0&&r&&r[1]===e.id) linkIdx.push(i); });
    const del=(sheetId,rows)=>rows.sort((a,b)=>b-a).map(i=>({deleteDimension:{range:{sheetId,dimension:"ROWS",startIndex:i,endIndex:i+1}}}));
    const req=[]; const stamp=stampText(new Date());
    if(e.op==="delete"){
      if(idx<0&&!linkIdx.length) return; // already gone
      const rateIdx=[]; rates.forEach((r,i)=>{ if(i>0&&r&&r[0]===e.id) rateIdx.push(i); });
      if(idx>0) req.push(...del(sR,[idx]));
      req.push(...del(sL,linkIdx), ...del(sT,rateIdx));
    } else {
      const photo=e.photo!=null?String(e.photo):null;
      if(idx>0){
        req.push({updateCells:{start:{sheetId:sR,rowIndex:idx,columnIndex:1},rows:[{values:[cell(e.name),cell(e.text||"")]}],fields:"userEnteredValue"}});
        req.push({updateCells:{start:{sheetId:sR,rowIndex:idx,columnIndex:4},rows:[{values:[cell(stamp),cell(who)]}],fields:"userEnteredValue"}});
        if(photo!=null){
          req.push({updateCells:{start:{sheetId:sR,rowIndex:idx,columnIndex:6},rows:[{values:[cell(photo)]}],fields:"userEnteredValue"}});
          if(photo==="") req.push({updateCells:{start:{sheetId:sR,rowIndex:idx,columnIndex:3},rows:[{values:[cell("")]}],fields:"userEnteredValue"}});
        }
      } else {
        req.push({appendCells:{sheetId:sR,rows:[{values:[cell(e.id),cell(e.name),cell(e.text||""),cell(""),cell(stamp),cell(who),cell(photo||"")]}],fields:"userEnteredValue"}});
      }
      const want=[...new Set(e.cats||[])];
      const have=linkIdx.map(i=>links[i][2]);
      const drop=linkIdx.filter(i=>!want.includes(links[i][2]));
      req.push(...del(sL,drop));
      const add=want.filter(c=>!have.includes(c));
      if(add.length) req.push({appendCells:{sheetId:sL,rows:add.map(c=>({values:[cell(e.id+"_"+c),cell(e.id),cell(c)]})),fields:"userEnteredValue"}});
      if(e.fromIdea&&meta.ids["Freezer Ideas"]!=null){
        const fi=await sheetVals(RECIPES_SHEET,"'Freezer Ideas'!R:T");
        const k=fi.findIndex((r,i)=>i>0&&r&&r[0]===e.fromIdea);
        if(k>0&&((fi[k][2]||"")!==e.id)) req.push({updateCells:{start:{sheetId:meta.ids["Freezer Ideas"],rowIndex:k,columnIndex:19},rows:[{values:[cell(e.id)]}],fields:"userEnteredValue"}});
      }
    }
    if(!req.length) return;
    try{ await callS("update_spreadsheet",{spreadsheetId:RECIPES_SHEET,requests:req,writeControl:{requiredRevisionId:meta.rev}}); }
    catch(err){ if(isStale(err)&&attempt===0) continue; if(isStale(err)) throw {userMsg:"The recipe sheet was busy. It'll try again shortly."}; throw accessFail(err); }
    try{ await S.mcp.invalidate(SRV,"get_values"); }catch(x){}
    return;
  }
}

let assetsP=null;
function getAssets(){ if(!assetsP) assetsP=(window.claude&&window.claude.use?window.claude.use("assets"):Promise.resolve(null)).catch(()=>null); return assetsP; }
function watchPicker(inp){
  if(!/Android/i.test(navigator.userAgent)||!inp) return;
  let done=false; const ok=()=>{ done=true; };
  addEventListener("blur",ok,{once:true}); addEventListener("pagehide",ok,{once:true});
  document.addEventListener("visibilitychange",ok,{once:true}); inp.addEventListener("change",ok,{once:true});
  setTimeout(()=>{ removeEventListener("blur",ok); removeEventListener("pagehide",ok); document.removeEventListener("visibilitychange",ok);
    if(!done) toast("This app didn't open the photo picker. Open Dinner Time in Chrome to add photos and files.",7000); },1800);
}
function shrinkPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const im=new Image();
    im.onload=()=>{ const max=1200, s=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)); const w=Math.round(im.naturalWidth*s), h=Math.round(im.naturalHeight*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h); URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.82); };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("decode")); };
    im.src=url;
  });
}

const GR_APPLIED_MS = 5*60*1000;
I.gear = '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/>';
I.file = '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>';
I.bell = '<path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/>';

function priceNum(v){ return gNum(String(v==null?"":v).replace(/\$/g,"")); }
function priceText(v){ const n=priceNum(v); return n==null?String(v||"").trim():"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function mdyToIso(v){ const p=parseDate(v); return p?`${p.y}-${String(p.m).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`:""; }
function gNum(v){ const s=String(v==null?"":v).replace(/[,\s]/g,""); if(!s) return null; const n=parseFloat(s); return isFinite(n)?n:null; }
function gFmt(n){ return n==null?"":Number(n).toLocaleString("en-US",{maximumFractionDigits:1}); }
function longDate(v){ const p=parseDate(v); return p?`${MON[p.m-1]} ${p.d}, ${p.y}`:String(v||""); }
function typeLabel(t){ return String(t||"").replace(/^z(?=[A-Z])/,"") || "Other"; }
function isoToday(){ const p=ctParts(new Date()); return `${p.year}-${p.month}-${p.day}`; }
function isoToMdy(s){ const m=String(s||"").match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?`${m[2]}/${m[3]}/${m[1]}`:""; }
function splitTasks(s){ return String(s||"").split(",").map(t=>t.trim()).filter(Boolean); }
function driveView(fid){ return "https://drive.google.com/file/d/"+encodeURIComponent(fid)+"/view"; }

/* ---------- data ---------- */
function gSrc(){ if(GR.gear&&GR.maint&&GR.rem&&GR.types) return {gear:GR.gear,maint:GR.maint,rem:GR.rem,types:GR.types}; return GR.snap; }
function gEdits(){
  const out={};
  for(const [k,e] of Object.entries(GR.applied)){ if(Date.now()-e.t<GR_APPLIED_MS) out[k]=e; else delete GR.applied[k]; }
  for(const [k,e] of Object.entries(GR.q)) out[k]=e;
  return Object.values(out).sort((a,b)=>(a.at||0)-(b.at||0));
}
function gApplyEdits(src){
  const edits=gEdits(); if(!edits.length) return src;
  let gear=src.gear.map(r=>r.slice()), maint=src.maint.map(r=>r.slice()), rem=src.rem.map(r=>r.slice());
  const findRem=id=>rem.find(r=>r[0]===id);
  const addRem=(r,gearId,source,e)=>{ if(findRem(r.id)) return; const x=pad([r.id,gearId,r.task||"",r.details||"",r.dueDate||"",r.dueReading||"","","",source,"",roleName(e.by)],GW.rem); x._pending=true; rem.push(x); };
  for(const e of edits){
    if(!e||!e.id) continue;
    if(e.op==="log"){
      if(!maint.some(r=>r[0]===e.id)){ const r=pad([e.id,e.gearId,e.work||"",e.date||"",e.reading||"",(e.tasks||[]).join(", "),e.notes||""],GW.maint); r._pending=true; maint.push(r); }
      for(const rid of e.doneRem||[]){ const r=findRem(rid); if(r){ r[6]=e.date; r[7]=e.id; } }
      if(e.newRem) addRem(e.newRem,e.gearId,"Maintenance "+e.id,e);
    } else if(e.op==="remind"){ addRem(e,e.gearId,"App",e); }
    else if(e.op==="done"){ const r=findRem(e.id); if(r){ r[6]=e.date; r[7]=e.maintId||""; r._pending=true; } }
    else if(e.op==="gsave"){ let r=gear.find(x=>x[0]===e.id); if(!r){ r=pad([e.id],GW.gear); gear.push(r); }
      r[1]=e.typeId||""; r[2]=e.name||""; r[3]=e.make||""; r[4]=e.model||""; r[5]=e.year||""; r[6]=e.vin||""; r[7]=e.pdate||""; r[8]=priceText(e.price); r[12]=e.notes||""; r[13]=e.parts||"";
      if(e.media){ const ph=e.photos||[], fl=e.files||[]; r[14]=e.manual||""; for(let k=0;k<3;k++){ r[15+k]=ph[k]||""; r[18+k]=fl[k]||""; } }
      r._pending=true; }
    else if(e.op==="gdel"){ gear=gear.filter(x=>x[0]!==e.id); maint=maint.filter(x=>x[1]!==e.id); rem=rem.filter(x=>x[1]!==e.id); }
  }
  return {...src, gear, maint, rem};
}
function remStatus(r,cur){
  const t=todayUTC(); const p=parseDate(r.dueDate); const dr=gNum(r.dueReading);
  let over=false, soon=false;
  if(p){ if(p.t<t) over=true; else if(p.t-t<=30*864e5) soon=true; }
  if(dr!=null&&cur!=null){ const left=dr-cur; if(left<=0) over=true; else if(left<=(dr>=1000?1000:Math.max(1,dr*0.1))) soon=true; }
  return over?"over":soon?"soon":(p||dr!=null)?"later":"open";
}
function remDueText(r,cur){
  const parts=[]; const p=parseDate(r.dueDate); const dr=gNum(r.dueReading);
  if(p) parts.push(longDate(r.dueDate));
  if(dr!=null){ let s=`at ${gFmt(dr)}`; if(cur!=null){ const left=dr-cur; s+= left>0?` (${gFmt(left)} to go)`:` (${gFmt(-left)} past)`; } parts.push(s); }
  return parts.join(" or ");
}
const ST_ORDER={over:0,soon:1,later:2,open:3};
function remSortKey(r){ const p=parseDate(r.dueDate); const dr=gNum(r.dueReading); const left=(dr!=null&&r.cur!=null)?(dr-r.cur)/Math.max(dr,1):null; return [ST_ORDER[r.status], p?p.t:(left!=null?todayUTC()+left*365*864e5:9e15)]; }
function gData(){
  let src=gSrc(); if(!src||!src.gear) return null; src=gApplyEdits(src);
  const typeName={}; for(const t of src.types||[]) if(t[0]) typeName[t[0]]=t[1]||"";
  const logsBy={}; for(const m of src.maint||[]){ if(!m[0]||!m[1]) continue;
    (logsBy[m[1]]=logsBy[m[1]]||[]).push({id:m[0], gearId:m[1], work:m[2]||"", date:m[3]||"", p:parseDate(m[3]), reading:gNum(m[4]), tasks:splitTasks(m[5]), notes:m[6]||"", photos:[m[7],m[8],m[9]].filter(Boolean), files:[m[10],m[11],m[12]].filter(Boolean), pending:!!m._pending}); }
  for(const k in logsBy) logsBy[k].sort((a,b)=>((b.p?b.p.t:0)-(a.p?a.p.t:0)));
  const remBy={}, farBy={}; const allRem=[];
  const list=src.gear.filter(g=>g[0]&&g[2]).map(g=>{
    const logs=logsBy[g[0]]||[];
    const reads=logs.map(l=>l.reading).filter(n=>n!=null); const gc=gNum(g[9]); if(gc!=null) reads.push(gc);
    const cur=reads.length?Math.max(...reads):null;
    return {id:g[0], typeId:g[1], type:typeLabel(typeName[g[1]]), name:g[2], make:(g[3]||"").trim(), model:(g[4]||"").trim(), year:g[5]||"", vin:g[6]||"", pdate:g[7]||"", price:g[8]||"",
      notes:g[12]||"", parts:g[13]||"", manual:g[14]||"", photos:[g[15],g[16],g[17]].filter(Boolean), files:[g[18],g[19],g[20]].filter(Boolean), logs, cur};
  });
  const byId={}; for(const g of list) byId[g.id]=g;
  for(const r of src.rem||[]){
    if(!r[0]||!r[1]||!byId[r[1]]) continue; const g=byId[r[1]];
    const x={id:r[0], gearId:r[1], task:r[2]||"", details:r[3]||"", dueDate:r[4]||"", dueReading:r[5]||"", doneDate:r[6]||"", doneIn:r[7]||"", pending:!!r._pending, cur:g.cur, gearName:g.name};
    if(x.doneDate) continue;
    x.status=remStatus(x,g.cur);
    /* more than 6 months out (by date, with no mileage / hours due): keep off the reminder lists */
    const dp=parseDate(x.dueDate);
    if(x.status==="later" && dp && gNum(x.dueReading)==null && dp.t-todayUTC()>182*864e5){ (farBy[g.id]=farBy[g.id]||[]).push(x); continue; }
    (remBy[g.id]=remBy[g.id]||[]).push(x); allRem.push(x);
  }
  const cmp=(a,b)=>{ const ka=remSortKey(a), kb=remSortKey(b); return ka[0]-kb[0]||ka[1]-kb[1]||a.task.localeCompare(b.task); };
  allRem.sort(cmp);
  for(const g of list){ g.reminders=(remBy[g.id]||[]).sort(cmp); g.later=(farBy[g.id]||[]).sort(cmp); g.next=g.reminders[0]||null; }
  const counts={}; for(const g of list) counts[g.type]=(counts[g.type]||0)+1;
  return {list, byId, reminders:allRem, counts};
}
/* task history: last done, how often (the start of predicting what's next) */
function taskHistory(g){
  const m={};
  for(const l of g.logs) for(const t of l.tasks){ const k=t.toLowerCase(); (m[k]=m[k]||{name:t,items:[]}).items.push(l); }
  return Object.values(m).map(h=>{
    const dated=h.items.filter(l=>l.p).sort((a,b)=>a.p.t-b.p.t);
    let every=null, everyRead=null;
    if(dated.length>=3){ const gaps=[]; for(let i=1;i<dated.length;i++) gaps.push((dated[i].p.t-dated[i-1].p.t)/864e5); every=gaps.reduce((a,b)=>a+b,0)/gaps.length; }
    const rd=h.items.filter(l=>l.reading!=null).map(l=>l.reading).sort((a,b)=>a-b);
    if(rd.length>=3){ const gaps=[]; for(let i=1;i<rd.length;i++) gaps.push(rd[i]-rd[i-1]); everyRead=gaps.reduce((a,b)=>a+b,0)/gaps.length; }
    const last=dated[dated.length-1]||h.items[0];
    return {name:h.name, count:h.items.length, last, every, everyRead};
  }).sort((a,b)=>((b.last&&b.last.p?b.last.p.t:0)-(a.last&&a.last.p?a.last.p.t:0)));
}
function everyText(h){
  const out=[];
  if(h.every){ const mo=h.every/30.44; out.push(mo>=1.5?`~${Math.round(mo)} months`:`~${Math.round(h.every)} days`); }
  if(h.everyRead) out.push(`~${gFmt(Math.round(h.everyRead))}`);
  return out.length?`usually every ${out.join(" or ")}`:"";
}

/* ---------- photos ---------- */
function gearPhoto(fid,want){
  if(!fid) return null;
  if(GR.imgUrl[fid]) return GR.imgUrl[fid];
  const c=RX.img[fid]; if(c) return c==="none"?null:c;
  if(want) gearImgWant(fid);
  return null;
}
function gearImgWant(fid){
  if(GR.imgBusy[fid]||RX.img[fid]||GR.imgUrl[fid]||!S.mcp||S.access!=="ok") return;
  if(!GR.imgQ.includes(fid)) GR.imgQ.push(fid); pumpGearImg();
}
function pumpGearImg(){
  while(GR.imgRun<2 && GR.imgQ.length){
    const fid=GR.imgQ.shift(); if(GR.imgUrl[fid]||RX.img[fid]||GR.imgBusy[fid]) continue;
    GR.imgRun++; fetchGearImg(fid).finally(()=>{ GR.imgRun--; pumpGearImg(); });
  }
}
async function fetchGearImg(fid){
  GR.imgBusy[fid]=true;
  try{
    const r=await S.mcp.callTool(DRIVE_SRV,"download_file_content",{fileId:fid});
    let p=r&&r.payload; if(typeof p==="string"){ try{ p=JSON.parse(p); }catch(e){} }
    const b64=p&&p.content; if(!b64) throw 0;
    if(p.mimeType && !/^image\//.test(p.mimeType)) throw 0;
    const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    const blob=new Blob([u],{type:p.mimeType||"image/jpeg"});
    let small=null; try{ small=await shrinkPhoto(blob); }catch(e){}
    if(!small) throw 0;
    RX.img[fid]=URL.createObjectURL(small); render(); refreshGearSheet();
    if(S.db && !S.dbReadOnly){
      const a=await getAssets();
      if(a){ try{ const up=await a.upload(small,{type:"image/jpeg"}); if(up&&up.url){ GR.imgUrl[fid]=up.url; await dbWrite("gearImg/"+safeSeg(fid),"set",{fid, url:up.url, assetId:up.id||"", at:Date.now()}); } }catch(e){} }
    }
  }catch(e){ RX.img[fid]="none"; }
  finally{ GR.imgBusy[fid]=false; render(); }
}
function gThumb(g,fid,cls,want){
  const src=gearPhoto(fid,want);
  return `<span class="${cls}">${src?`<img src="${esc(src)}" alt="" loading="lazy" decoding="async">`:`<span class="rx-ph" aria-hidden="true">${esc((g.name.match(/[A-Za-z0-9]/)||["·"])[0].toUpperCase())}</span>`}</span>`;
}

/* ---------- list view ---------- */
function remLine(r,withGear){
  const due=remDueText(r,r.cur);
  const pill={over:"Overdue",soon:"Soon",later:"Upcoming",open:"Open"}[r.status];
  return `<span class="t"><b>${esc(withGear?`${r.gearName}: ${r.task}`:r.task)}</b>${due||r.details?`<span>${esc([due,r.details].filter(Boolean).join(" · "))}</span>`:""}${r.pending?`<span class="gr-wait">${S.access==="ok"?"Saving to the sheet…":"Not on the sheet yet"}</span>`:""}</span><span class="gr-pill ${r.status}">${pill}</span>`;
}
function renderGear(){
  const host=document.getElementById("list-gear"); const d=gData();
  const coming=document.getElementById("gr-coming"), chips=document.getElementById("gr-chips");
  if(!d){
    coming.innerHTML=""; chips.innerHTML="";
    host.innerHTML=(S.access!=="ok"&&S.access!=="checking"&&S.dbReady)?`<div class="banner warn">${icon("gear",20)}<div class="b-body">Your gear shows up here once a phone that can reach the ${esc(GEAR_NAME)} sheet opens Dinner Time!. After that it stays here for both of you.</div></div>`
      : GR.err ? `<div class="banner warn">${icon("alert",20)}<div class="b-body">Can't read the ${esc(GEAR_NAME)} sheet right now. Try again in a moment.</div></div>`
      : `<div class="gr-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
    return;
  }
  // coming up
  const due=d.reminders.filter(r=>r.status==="over"||r.status==="soon");
  const later=d.reminders.filter(r=>r.status==="later");
  const show=due.concat(later.slice(0,Math.max(0,4-due.length)));
  coming.innerHTML=`<section class="gr-card" aria-labelledby="gr-ch"><div class="gr-card-h"><h3 id="gr-ch">Coming up</h3>${d.reminders.length>show.length?`<button class="gr-seeall" type="button" data-allrem>See all ${d.reminders.length}${icon("chev",16)}</button>`:""}</div>${show.length?`<div class="gr-inset">${show.map(remRow).join("")}</div>`:`<p class="sub gr-none">${icon("check",18)}Nothing due. Reminders you add show up here.</p>`}</section>`;
  // chips
  const types=Object.keys(d.counts).sort((a,b)=>a.localeCompare(b));
  if(GR.type!=="all"&&!d.counts[GR.type]) GR.type="all";
  chips.innerHTML=[`<button class="rx-chip" type="button" data-gtype="all" aria-pressed="${GR.type==="all"}">All<span class="n">${d.list.length}</span></button>`,...types.map(t=>`<button class="rx-chip" type="button" data-gtype="${esc(t)}" aria-pressed="${GR.type===t}">${esc(t)}<span class="n">${d.counts[t]}</span></button>`)].join("");
  const q=GR.search.trim().toLowerCase();
  const items=d.list.filter(g=>(GR.type==="all"||g.type===GR.type) && (!q || [g.name,g.make,g.model,g.year,g.vin,g.type,g.notes,g.parts].some(s=>String(s).toLowerCase().includes(q))));
  if(!items.length){ host.innerHTML=`<p class="rx-empty">No gear matches${q?` “${esc(GR.search)}”`:""}.</p>`; return; }
  const groups={}; for(const g of items) (groups[g.type]=groups[g.type]||[]).push(g);
  host.innerHTML=Object.keys(groups).sort((a,b)=>a.localeCompare(b)).map(t=>`<section class="gr-group"><div class="gr-gh"><span>${esc(t)}</span><span class="n num">${groups[t].length}</span></div><div class="gr-inset">${groups[t].sort((a,b)=>a.name.localeCompare(b.name)).map(g=>{
    const mk=[g.year,g.make,g.model].map(x=>String(x||"").trim()).filter(Boolean).join(" ");
    const nx=g.next; const hot=nx&&(nx.status==="over"||nx.status==="soon");
    const due=hot?remShort({...nx,cur:g.cur}):"";
    return `<button class="gr-item" type="button" data-gear="${esc(g.id)}">${gThumb(g,g.photos[0],"gr-thumb",S.view==="gear")}<span class="t"><span class="nm">${esc(g.name.trim())}</span>${hot?`<span class="mk due ${nx.status}">${esc(nx.task)}${due?` · ${esc(due)}`:""}</span>`:(mk?`<span class="mk">${esc(mk)}</span>`:"")}</span>${hot?`<span class="gr-pill ${nx.status}">${nx.status==="over"?"Overdue":"Soon"}</span>`:`<span class="gr-chev">${icon("chev",18)}</span>`}</button>`;
  }).join("")}</div></section>`).join("");
}
function remShort(r){
  const parts=[]; const p=parseDate(r.dueDate); const dr=gNum(r.dueReading);
  if(p) parts.push(p.y===+ctParts(new Date()).year?shortDate(r.dueDate):`${shortDate(r.dueDate)}, ${p.y}`);
  if(dr!=null){ if(r.cur!=null){ const left=dr-r.cur; parts.push(left>0?`${gFmt(left)} to go`:`${gFmt(-left)} past`); } else parts.push(`at ${gFmt(dr)}`); }
  return parts.join(" or ");
}
function remRow(r,withDetails){
  const due=remShort(r);
  const pill={over:"Overdue",soon:"Soon",later:"Upcoming",open:"Open"}[r.status];
  return `<button class="gr-item gr-remi" type="button" data-gear="${esc(r.gearId)}"><span class="gr-dot ${r.status}" aria-hidden="true"></span><span class="t"><span class="nm">${esc(r.task)}</span><span class="mk">${esc([r.gearName.trim(),due].filter(Boolean).join(" · "))}</span>${withDetails===true&&r.details?`<span class="mk det">${esc(r.details)}</span>`:""}${r.pending?`<span class="gr-wait">${S.access==="ok"?"Saving to the sheet…":"Not on the sheet yet"}</span>`:""}</span><span class="gr-pill ${r.status}">${pill}</span></button>`;
}
(function wireGearView(){
  const v=document.getElementById("view-gear");
  v.addEventListener("click",e=>{
    const t=e.target.closest("[data-gtype]"); if(t){ GR.type=t.dataset.gtype; render(); return; }
    if(e.target.closest("[data-allrem]")){ openAllReminders(); return; }
    if(e.target.closest("[data-alllog]")){ openAllMaintenance(); return; }

/* ---------- detail sheet ---------- */
function canEditGear(){ return !!S.role && ((S.db&&!S.dbReadOnly) || (S.access==="ok"&&S.mcp)); }
function gearSheetBody(g){
  const h=[];
  if(g.photos.length) h.push(`<div class="gr-photos">${g.photos.map(f=>gThumb(g,f,"gr-ph",true)).join("")}</div>`);
  const facts=[["Type",g.type],["Make",g.make],["Model",g.model],["Year",g.year],["Serial / VIN",g.vin],["Purchased",[g.pdate?longDate(g.pdate):"",g.price].filter(Boolean).join(" · ")],["Mileage / Hours",g.cur!=null?gFmt(g.cur):""]].filter(f=>String(f[1]||"").trim());
  if(facts.length) h.push(`<dl class="gr-facts">${facts.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`);
  // reminders
  h.push(`<div class="gr-sec"><div class="basket-h"><h3>Reminders</h3>${canEditGear()?`<button class="linkbtn" type="button" data-radd>Add reminder</button>`:""}</div>${g.reminders.length?g.reminders.map(r=>`<div class="gr-remrow">${remLine(r,false)}${canEditGear()?`<button class="btn small" type="button" data-rdone="${esc(r.id)}">Done</button>`:""}</div>`).join(""):`<p class="sub">Nothing to remember right now.</p>`}${g.later.length?`<details class="gr-later"><summary>${g.later.length} more than 6 months out</summary>${g.later.map(r=>`<div class="gr-remrow">${remLine(r,false)}${canEditGear()?`<button class="btn small" type="button" data-rdone="${esc(r.id)}">Done</button>`:""}</div>`).join("")}</details>`:""}</div>`);
  if(g.notes) h.push(`<div class="gr-sec"><h3>Notes</h3><p class="gr-text">${linkify(g.notes)}</p></div>`);
  if(g.parts) h.push(`<div class="gr-sec"><h3>Parts &amp; specs</h3><p class="gr-text">${linkify(g.parts)}</p></div>`);
  const files=[...(g.manual?[["Manual",g.manual]]:[]),...g.files.map((f,i)=>[g.files.length>1?`File ${i+1}`:"File",f])];
  if(files.length) h.push(`<div class="gr-sec"><h3>Manuals &amp; files</h3><div class="gr-files">${files.map(([n,f])=>`<button type="button" class="gr-filebtn" data-pdf="${esc(f)}" data-pdfname="${esc(n)}">${icon("file",20)}<span>${esc(n)}</span>${icon("chev",18)}</button>`).join("")}</div></div>`);

async function driveUpload(blob,title,mime,parentId){
  const type=mime||blob.type||"application/octet-stream";

  let content;
  if(await driveFileArgs()) content={$file:{data:blob,name:title,type}};
  else { content=await blobB64(blob); if(content.length>900*1024){ const e=new Error("too big"); e.code="too_large"; throw e; } }
  const call=S.mcp.callTool(DRIVE_SRV,"create_file",{title, parentId, contentMimeType:type, base64Content:content, disableConversionToGoogleType:true},{cache:false});
  const r=await Promise.race([call, new Promise((_,rej)=>setTimeout(()=>{ const e=new Error("timeout"); e.code="timeout"; rej(e); },11*60000))]);
  let p=r&&r.payload; if(typeof p==="string"){ try{ p=JSON.parse(p); }catch(e){} }
  const id=p&&(p.id||(p.file&&p.file.id)); if(!id) throw new Error("no id");

}

/* ---------- queue + sheet writes ---------- */
let gChain=Promise.resolve();
function queueGear(e){
  if(!S.role){ showWelcome(); return Promise.resolve(false); }
  e={...e, by:S.role, at:Date.now()};
  const key=e.op+"-"+e.id;
  const direct=S.access==="ok"&&S.mcp;
  if(S.db&&!S.dbReadOnly){
    GR.q[key]=e; render(); refreshGearSheet();
    return gChain=gChain.then(()=>dbWrite("gearQueue/"+key,"set",e)).then(ok=>{
      if(!ok){ delete GR.q[key]; render(); refreshGearSheet(); toast("That didn't save. Try again.",4000); return false; }
      if(!direct) toast("Saved. The sheet catches up within the hour.",4500);
      processGearQueue(); return true;
    });
  }
  if(!direct){ toast("Sign in to Claude to save this."); return Promise.resolve(false); }
  GR.applied[key]={...e,t:Date.now()}; render();
  return gChain=gChain.then(()=>writeGearOp(e)).then(()=>true).catch(err=>{ delete GR.applied[key]; render(); toast((err&&err.userMsg)||"That didn't save. Try again.",4000); return false; });
}
async function processGearQueue(){
  if(GR.busy||S.access!=="ok"||!S.mcp||!S.db) return;
  const ent=Object.entries(GR.q).sort((a,b)=>(a[1].at||0)-(b[1].at||0))[0]; if(!ent) return;
  const [key,next]=ent; GR.busy=true;
  try{
    await writeGearOp(next);
    GR.applied[key]={...next,t:Date.now()};
    if(GR.q[key]&&GR.q[key].at===next.at){ delete GR.q[key]; await dbWrite("gearQueue/"+key,"delete"); }
  }catch(e){ console.warn("gear sync failed",e); GR.busy=false; if(e&&e.userMsg&&next.by===S.role) toast(e.userMsg,4000); return; }
  GR.busy=false; render(); setTimeout(processGearQueue,300);
}
function serialOf(mdy){ const p=parseDate(mdy); return p?p.t/86400000+25569:null; }
async function writeGearOp(e){
  const who=roleName(e.by||S.role);
  const num=v=>{ const n=gNum(v); return n==null?cell(""):{userEnteredValue:{numberValue:n}}; };
  const day=v=>{ const n=serialOf(v); return n==null?cell(v||""):{userEnteredValue:{numberValue:n}}; };
  for(let attempt=0; attempt<2; attempt++){
    const meta=await sheetMeta(GEAR_SHEET); mustHave(meta,["Gear","Maintenance","Reminders"]);
    const [gIds,mIds,rIds]=await Promise.all([sheetVals(GEAR_SHEET,"'Gear'!A:A"),sheetVals(GEAR_SHEET,"'Maintenance'!A:B"),sheetVals(GEAR_SHEET,"'Reminders'!A:B")]);
    const sG=meta.ids["Gear"], sM=meta.ids["Maintenance"], sR=meta.ids["Reminders"]; const stamp=stampText(new Date()); const req=[];
    const remRow=id=>rIds.findIndex((r,i)=>i>0&&r&&r[0]===id);
    const appendRem=(r,src)=>({appendCells:{sheetId:sR,rows:[{values:[cell(r.id),cell(e.gearId),cell(r.task||""),cell(r.details||""),r.dueDate?day(r.dueDate):cell(""),num(r.dueReading),cell(""),cell(""),cell(src),cell(stamp),cell(who)]}],fields:"userEnteredValue"}});
    const setDone=(i,date,mid)=>({updateCells:{start:{sheetId:sR,rowIndex:i,columnIndex:6},rows:[{values:[day(date),cell(mid||"")]}],fields:"userEnteredValue"}});
    if(e.op==="log"){
      if(!mIds.some((r,i)=>i>0&&r&&r[0]===e.id)) req.push({appendCells:{sheetId:sM,rows:[{values:[cell(e.id),cell(e.gearId),cell(e.work||""),day(e.date),num(e.reading),cell((e.tasks||[]).join(", ")),cell(e.notes||""),cell(""),cell(""),cell(""),cell(""),cell(""),cell(""),cell(stamp),cell(who)]}],fields:"userEnteredValue"}});
      for(const rid of e.doneRem||[]){ const i=remRow(rid); if(i>0) req.push(setDone(i,e.date,e.id)); }
      if(e.newRem&&remRow(e.newRem.id)<0) req.push(appendRem(e.newRem,"Maintenance "+e.id));
    } else if(e.op==="remind"){ if(remRow(e.id)<0) req.push(appendRem(e,"App")); }
    else if(e.op==="done"){ const i=remRow(e.id); if(i>0) req.push(setDone(i,e.date,e.maintId)); }
    else if(e.op==="gsave"){
      const gi=gIds.findIndex((r,i)=>i>0&&r&&r[0]===e.id);
      const price=priceNum(e.price), yr=gNum(e.year);
      const ph=e.photos||[], fl=e.files||[]; const media=e.media?[e.manual||"",ph[0]||"",ph[1]||"",ph[2]||"",fl[0]||"",fl[1]||"",fl[2]||""]:["","","","","","",""];
      const mid=[cell(e.typeId||""),cell(e.name||""),cell(e.make||""),cell(e.model||""),yr==null?cell(e.year||""):{userEnteredValue:{numberValue:yr}},cell(e.vin||""),e.pdate?day(e.pdate):cell(""),price==null?cell(""):{userEnteredValue:{numberValue:price}}];
      if(gi>0){
        req.push({updateCells:{start:{sheetId:sG,rowIndex:gi,columnIndex:1},rows:[{values:mid}],fields:"userEnteredValue"}});
        req.push({updateCells:{start:{sheetId:sG,rowIndex:gi,columnIndex:12},rows:[{values:[cell(e.notes||""),cell(e.parts||"")]}],fields:"userEnteredValue"}});
        req.push({updateCells:{start:{sheetId:sG,rowIndex:gi,columnIndex:21},rows:[{values:[cell(stamp),cell(who)]}],fields:"userEnteredValue"}});
        if(e.media) req.push({updateCells:{start:{sheetId:sG,rowIndex:gi,columnIndex:14},rows:[{values:media.map(cell)}],fields:"userEnteredValue"}});
      } else {
        req.push({appendCells:{sheetId:sG,rows:[{values:[cell(e.id),...mid,cell(""),cell(""),cell(""),cell(e.notes||""),cell(e.parts||""),...media.map(cell),cell(stamp),cell(who)]}],fields:"userEnteredValue"}});
      }
    }
    else if(e.op==="gdel"){
      const rowsOf=(vals,col)=>vals.map((r,i)=>(i>0&&r&&r[col]===e.id)?i:-1).filter(i=>i>0).sort((a,b)=>b-a);
      const del=(sid,i)=>({deleteDimension:{range:{sheetId:sid,dimension:"ROWS",startIndex:i,endIndex:i+1}}});
      for(const i of rowsOf(rIds,1)) req.push(del(sR,i));
      for(const i of rowsOf(mIds,1)) req.push(del(sM,i));
      for(const i of rowsOf(gIds,0)) req.push(del(sG,i));
    }
    if(!req.length) return;
    try{ await callS("update_spreadsheet",{spreadsheetId:GEAR_SHEET,requests:req,writeControl:{requiredRevisionId:meta.rev}}); }
    catch(err){ if(isStale(err)&&attempt===0) continue; if(isStale(err)) throw {userMsg:`The ${GEAR_NAME} sheet was busy. It'll try again shortly.`}; throw accessFail(err); }
    try{ await S.mcp.invalidate(SRV,"get_values"); }catch(x){}
    return;
  }
}

/* ---------- live reads, shared snapshot ---------- */
function startGearWatches(){
  if(startGearWatches.done||!S.mcp) return; startGearWatches.done=true;
  const reg=(key,range,width)=>S.mcp.watchTool(SRV,"get_values",{spreadsheetId:GEAR_SHEET, range},ev=>{
    if(ev.type==="data"){
      GR[key]=((ev.result&&ev.result.payload&&ev.result.payload.values)||[]).slice(1).map(r=>pad(r,width)); GR.err=null;
      render(); refreshGearSheet(); saveGearSnap(); processGearQueue();
    } else { GR.err=ev.error&&ev.error.code||"error"; render(); }
  },{refetchInterval:120000});
  reg("gear","'Gear'!A:W",GW.gear); reg("maint","'Maintenance'!A:O",GW.maint); reg("rem","'Reminders'!A:K",GW.rem); reg("types","'Gear Types'!A:B",GW.types);
}
let gSnapHash="", gSnapT=0;
function saveGearSnap(){
  clearTimeout(gSnapT); gSnapT=setTimeout(async()=>{
    if(!S.db||S.dbReadOnly||!(GR.gear&&GR.maint&&GR.rem&&GR.types)) return;
    const h=hash(JSON.stringify([GR.gear,GR.maint,GR.rem,GR.types]));
    if(h===gSnapHash) return;
    if(GR.snap&&GR.snap.hash===h){ gSnapHash=h; return; }
    const parts=[]; let cur=[], size=0;
    for(const r of GR.gear){ const n=JSON.stringify(r).length; if(size+n>150000&&cur.length){ parts.push(cur); cur=[]; size=0; } cur.push(r); size+=n; }
    if(cur.length) parts.push(cur);
    const ver=Date.now();
    for(let i=0;i<parts.length;i++){ if(!await dbWrite("gsnap/part-"+i,"set",{ver,i,rows:parts[i]})) return; }
    if(await dbWrite("gsnap/meta","set",{ver,hash:h,parts:parts.length,maint:GR.maint,rem:GR.rem,types:GR.types,readAt:Date.now(),readBy:meId()})) gSnapHash=h;
  },1500);
}
function startGearDb(){
  if(!S.db) return;
  S.db.collection("gsnap").onSnapshot(s=>{
    const docs={}; s.docs.forEach(d=>{ docs[d.id]=d.data(); });
    const m=docs.meta; if(!m||!m.parts) return;
    const rows=[]; for(let i=0;i<m.parts;i++){ const p=docs["part-"+i]; if(!p||p.ver!==m.ver) return; rows.push(...(p.rows||[])); }
    GR.snap={gear:rows.map(r=>pad(r,GW.gear)), maint:(m.maint||[]).map(r=>pad(r,GW.maint)), rem:(m.rem||[]).map(r=>pad(r,GW.rem)), types:(m.types||[]).map(r=>pad(r,GW.types)), hash:m.hash, readAt:m.readAt};
    render(); refreshGearSheet();
  },()=>{});
  S.db.collection("gearQueue").onSnapshot(s=>{ const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&x.id&&x.op) m[d.id]=x; });
    for(const k of Object.keys(GR.q)) if(!m[k]&&!GR.applied[k]) GR.applied[k]={...GR.q[k],t:Date.now()};
    GR.q=m; render(); refreshGearSheet(); processGearQueue(); },()=>{});
  S.db.collection("gearPdf").onSnapshot(s=>{ s.docs.forEach(d=>{ const x=d.data(); if(x&&x.fid&&x.url) PV.url[x.fid]=x.url; }); },()=>{});
  S.db.collection("gearImg").onSnapshot(s=>{ s.docs.forEach(d=>{ const x=d.data(); if(x&&x.fid&&x.url) GR.imgUrl[x.fid]=x.url; }); render(); refreshGearSheet(); },()=>{});
}

/* =====================================================================
   PDF VIEWER — hidden page (#pdf). Opened from a gear item's Manuals & files;
   Back returns to that item. Bytes come from Google Drive on a device that has
   it, then a copy is kept with the app (gearPdf/<fileId>) so every device can open it.
   ===================================================================== */
const PV={fid:null,name:"",from:null,doc:null,zoom:1,tok:0,url:{},io:null,pages:[]};
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
let pdfLibP=null;
function pdfLib(){
  if(!pdfLibP) pdfLibP=new Promise((res,rej)=>{
    if(window.pdfjsLib) return res(window.pdfjsLib);
    const sc=document.createElement("script"); sc.src=PDFJS+"pdf.min.js";
    sc.onload=()=>{ const L=window.pdfjsLib; if(!L) return rej(new Error("lib")); L.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; res(L); };
    sc.onerror=()=>{ pdfLibP=null; rej(new Error("lib")); };
    document.head.appendChild(sc);
  });
  return pdfLibP;
}
function openPdf(fid,name,from){
  if(!fid) return;
  PV.fid=fid; PV.name=name||"File"; PV.from=from||null; PV.zoom=1;
  closeSheet(true); go("pdf"); loadPdf();
}
function pdfReset(){
  PV.tok++; if(PV.io){ PV.io.disconnect(); PV.io=null; }
  if(PV.doc){ try{ PV.doc.destroy(); }catch(e){} PV.doc=null; }
  PV.pages=[]; const h=document.getElementById("pv-pages"); if(h) h.innerHTML="";
}
function pdfBack(){
  const f=PV.from; pdfReset(); PV.fid=null;
  go(f&&f.view&&f.view!=="pdf"?f.view:"gear");
  if(f&&f.gearId){ const el=openGear(f.gearId); if(el&&f.st) requestAnimationFrame(()=>{ const b=el.querySelector(".sh-body"); if(b) b.scrollTop=f.st; }); }
}
function pvMsg(html){ const h=document.getElementById("pv-pages"); h.innerHTML=`<div class="pv-msg">${html}</div>`; document.getElementById("pv-page").textContent=""; }
function pvDriveBtn(){ return `<a class="btn" href="${esc(driveView(PV.fid))}" target="_blank" rel="noopener">Open in Google Drive</a>`; }
async function loadPdf(){
  pdfReset(); const tok=PV.tok;
  const d=gData(); const g=PV.from&&d&&d.byId[PV.from.gearId];
  document.getElementById("h-pdf").textContent=PV.name;
  document.getElementById("pv-gear").textContent=g?g.name.trim():"";
  document.getElementById("pv-drive").href=driveView(PV.fid);
  pvMsg(`<div class="pv-spin" aria-hidden="true"></div><p>Opening ${esc(PV.name.toLowerCase())}…</p>`);
  let src=null, mime="application/pdf";
  try{
    const cached=PV.url[PV.fid];
    if(cached) src={url:cached};
    else if(S.mcp&&S.access==="ok"){
      const r=await S.mcp.callTool(DRIVE_SRV,"download_file_content",{fileId:PV.fid});
      let p=r&&r.payload; if(typeof p==="string"){ try{ p=JSON.parse(p); }catch(e){} }
      const b64=p&&p.content; if(!b64) throw new Error("empty");
      mime=p.mimeType||mime;
      const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
      if(tok!==PV.tok) return;
      if(/^image\//.test(mime)){ const url=URL.createObjectURL(new Blob([u],{type:mime})); document.getElementById("pv-pages").innerHTML=`<div class="pv-page"><img src="${esc(url)}" alt="${esc(PV.name)}"></div>`; return; }
      if(!/pdf/i.test(mime)){ pvMsg(`<p>This file isn't a PDF, so it can't open here.</p>${pvDriveBtn()}`); return; }
      pdfKeep(PV.fid,new Blob([u],{type:"application/pdf"}));
      src={data:u};
    } else {
      pvMsg(`<p>This file hasn't been opened on a phone with Google Drive yet. Once ${esc(OWNER_NAME)} opens it, it opens here for everyone.</p>${pvDriveBtn()}`); return;
    }
    const L=await pdfLib(); if(tok!==PV.tok) return;
    const doc=await L.getDocument({...src, isEvalSupported:false}).promise;
    if(tok!==PV.tok){ try{ doc.destroy(); }catch(e){} return; }
    PV.doc=doc; await pvLayout();
  }catch(e){
    if(tok!==PV.tok) return;
    console.warn("pdf",e);
    pvMsg(`<p>Couldn't open this file here.</p>${pvDriveBtn()}`);
  }
}
async function pdfKeep(fid,blob){
  if(PV.url[fid]||!S.db||S.dbReadOnly||blob.size>19*1024*1024) return;
  try{ const a=await getAssets(); if(!a) return;
    const up=await a.upload(blob,{type:"application/pdf"});
    if(up&&up.url){ PV.url[fid]=up.url; await dbWrite("gearPdf/"+safeSeg(fid),"set",{fid,url:up.url,assetId:up.id||"",size:blob.size,at:Date.now()}); }
  }catch(e){}
}
async function pvLayout(){
  const doc=PV.doc; if(!doc) return; const tok=PV.tok;
  const host=document.getElementById("pv-pages");
  const first=await doc.getPage(1); if(tok!==PV.tok) return;
  const v1=first.getViewport({scale:1}); const ratio=v1.height/v1.width;
  const w=Math.max(200,host.clientWidth)*PV.zoom;
  if(PV.io) PV.io.disconnect();
  host.innerHTML=""; PV.pages=[];
  for(let i=1;i<=doc.numPages;i++){
    const el=document.createElement("div"); el.className="pv-page"; el.dataset.n=i;
    el.style.width=w+"px"; el.style.height=Math.round(w*ratio)+"px";
    el.innerHTML=`<span class="pv-num">${i}</span>`;
    host.appendChild(el); PV.pages.push({el,done:0});
  }
  host.classList.toggle("zoomed",PV.zoom>1);
  PV.io=new IntersectionObserver(ents=>{ for(const en of ents) if(en.isIntersecting) pvRender(+en.target.dataset.n); },{root:null,rootMargin:"900px 0px"});
  PV.pages.forEach(p=>PV.io.observe(p.el));
  pvPageLabel();
}
async function pvRender(n){
  const rec=PV.pages[n-1]; if(!rec||rec.done===PV.zoom||rec.busy||!PV.doc) return; rec.busy=true; const tok=PV.tok;
  try{
    const page=await PV.doc.getPage(n); if(tok!==PV.tok) return;
    const base=page.getViewport({scale:1});
    const cssW=parseFloat(rec.el.style.width); const scale=cssW/base.width;
    let dpr=Math.min(window.devicePixelRatio||1,2);
    while(base.width*scale*dpr*base.height*scale*dpr>12e6 && dpr>1) dpr-=.25;
    const vp=page.getViewport({scale:scale*dpr});
    const cv=document.createElement("canvas"); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    cv.style.width=cssW+"px"; cv.style.height=Math.round(cssW*base.height/base.width)+"px";
    rec.el.style.height=cv.style.height;
    await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    if(tok!==PV.tok) return;
    const old=rec.el.querySelector("canvas"); if(old) old.remove();

/* ---------------- boot ---------------- */
/* =====================================================================
   WEEKLY MENU — "Dinner Time – Recipes" › Menu (+ Menu Log, Menu Archive)
   Menu A..L: 0 MenuID 1 Date (YYYY-MM-DD) 2 Day 3 Role (Main/Side) 4 Source
     (Recipe / Freezer idea) 5 Recipe ID 6 Recipe name 7 Picked by 8 Via
     9 Picked at 10 Notes 11 Outcome
   Changes go to the shared queue menuQueue/<doc> so both phones see them at
   once; a phone that can reach the sheet (or the hourly run) writes them and
   adds a Menu Log row. The hourly run moves past nights to Menu Archive at 3 a.m.
   ===================================================================== */
const MN = { rows:null, err:null, q:{}, applied:{}, busy:false };
const MN_APPLIED_MS = 5*60*1000;
I.cal = '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M12 13v5M9.5 15.5h5"/>';
I.more = '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>';

function isoOf(t){ const d=new Date(t); return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,"0")}-${String(d.getUTCDate()).padStart(2,"0")}`; }
function mnToday(){ return isoOf(todayUTC()); }
function mnDates(){ const t=todayUTC(); const out=[]; for(let i=0;i<7;i++) out.push(isoOf(t+i*86400000)); return out; }
function mnNorm(v){ const p=parseDate(v); return p?isoOf(p.t):""; }
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function mnDayName(iso){ const p=parseDate(iso); return p?DOW[new Date(p.t).getUTCDay()]:""; }
function mnLabel(iso,long){
  const p=parseDate(iso); if(!p) return iso; const t=mnToday();
  if(iso===t) return "Tonight";
  if(iso===isoOf(todayUTC()+86400000)) return "Tomorrow";
  const dn=mnDayName(iso); return long?`${dn}, ${MON[p.m-1]} ${p.d}`:dn;
}
function mnSub(iso){ const p=parseDate(iso); if(!p) return ""; const near=iso===mnToday()||iso===isoOf(todayUTC()+86400000); return near?`${mnDayName(iso).slice(0,3)} ${MON[p.m-1]} ${p.d}`:`${MON[p.m-1]} ${p.d}`; }
/* mid-sentence: "tonight", "tomorrow", "Tuesday, Nov 3" */
function mnIn(iso){ const l=mnLabel(iso,true); return l==="Tonight"||l==="Tomorrow"?l.toLowerCase():l; }
/* whose night it is to cook (the household cook chart, DT.cook) */
const COOK=Object.fromEntries(Object.entries(DT.cook||{}).map(([d,a])=>[d,(a||[]).filter(r=>PERSON[r])]));
function cookOf(iso){ return COOK[mnDayName(iso)]||[]; }
function cookPill(iso){ const c=cookOf(iso); if(!c.length) return ""; const cls=c.length>1?"both":"p-"+c[0];
  const t=c.length>1?c.map(roleName).join(" & "):`${roleName(c[0])}'s night`; return `<span class="mn-cook ${cls}">${esc(t)}</span>`; }
function newMenuId(date){ return `M-${date}-${rid(5)}`; }
function whoRole(name){ const n=String(name||"").trim().toLowerCase(); const p=PEOPLE.find(x=>x.name.toLowerCase()===n||x.id===n); return p?p.id:null; }

/* sheet rows (live, else shared snapshot) + pending/just-applied queue ops */
function mnBase(){ const src=MN.rows || (S.snaps.menu&&S.snaps.menu.rows) || null; if(!src) return null;
  return src.map(r=>pad(r,12)).filter(r=>r[0]||r[6]).map(r=>({mid:r[0], date:mnNorm(r[1]), role:/^side/i.test(r[3])?"Side":"Main", src:/idea/i.test(r[4])?"Freezer idea":/new/i.test(r[4])?"New recipe":"Recipe", rid:r[5], name:r[6], by:whoRole(r[7]), byName:r[7], via:r[8], at:r[9], outcome:r[11]})); }
function mnOps(){
  const out={};
  for(const [k,o] of Object.entries(MN.applied)){ if(Date.now()-o.t<MN_APPLIED_MS) out[k]=o; else delete MN.applied[k]; }
  for(const [k,o] of Object.entries(MN.q)) out[k]=o;
  return Object.values(out).sort((a,b)=>(a.at||0)-(b.at||0));
}
function mnRows(){
  const base=mnBase(); const ops=mnOps(); if(!base&&!ops.length) return null;
  let rows=(base||[]).slice(); const pend=new Set(Object.values(MN.q).map(o=>o.nmid||o.mid));
  const row=o=>({mid:o.nmid||o.mid, date:o.date, role:o.role, src:o.src, rid:o.rid, name:o.name, by:o.by, byName:roleName(o.by), via:"App", at:o.at, outcome:""});
  for(const o of ops){
    if(o.op==="add"){ if(!rows.some(r=>r.mid===o.mid)) rows.push(row(o)); }
    else if(o.op==="replace"){ rows=rows.filter(r=>r.mid!==o.mid); if(!rows.some(r=>r.mid===o.nmid)) rows.push(row(o)); }
    else if(o.op==="remove"){ rows=rows.filter(r=>r.mid!==o.mid); }
    else if(o.op==="outcome"){ rows=rows.map(r=>r.date===o.date?{...r,outcome:o.outcome}:r); }
  }
  for(const r of rows) r.pending=pend.has(r.mid);
  return rows;
}
function mnNight(date){ const rows=mnRows()||[]; return rows.filter(r=>r.date===date).sort((a,b)=>(a.role==="Main"?0:1)-(b.role==="Main"?0:1)||String(a.at).localeCompare(String(b.at))); }

/* ---------- reading ---------- */
function startMenuWatches(){
  if(startMenuWatches.done||!S.mcp) return; startMenuWatches.done=true;
  S.mcp.watchTool(SRV,"get_values",{spreadsheetId:RECIPES_SHEET, range:"'Menu'!A:L"},ev=>{
    if(ev.type==="data"){
      MN.rows=((ev.result&&ev.result.payload&&ev.result.payload.values)||[]).slice(1).map(r=>pad(r,12)).filter(r=>r[0]||r[6]); MN.err=null;
      saveSnapshot("menu",MN.rows,Date.now()); render(); refreshMenuSheets(); processMenuQueue();
    } else { MN.err=(ev.error&&ev.error.code)||"error"; render(); }
  },{refetchInterval:120000});
}
function startMenuDb(){
  if(!S.db) return;
  S.db.collection("menuQueue").onSnapshot(s=>{
    const m={}; s.docs.forEach(d=>{ const x=d.data(); if(x&&x.op) m[d.id]={_id:d.id,...x}; });
    for(const k of Object.keys(MN.q)) if(!m[k]&&!MN.applied[k]) MN.applied[k]={...MN.q[k],t:Date.now()};
    MN.q=m; render(); refreshMenuSheets(); processMenuQueue();
  },()=>{});
}

/* ---------- writing ---------- */
function canPlan(){ return !!S.role && ((S.db&&!S.dbReadOnly) || (S.access==="ok"&&S.mcp)); }
let menuChain=Promise.resolve();
function queueMenu(o){
  if(!S.role){ showWelcome(); return Promise.resolve(false); }
  if(!canPlan()){ toast(`This account can't change the menu. Ask ${OWNER_NAME} to invite you as an Editor.`); return Promise.resolve(false); }
  o={...o, by:S.role, at:Date.now()};
  const key=o.op==="add"?"add-"+o.mid:o.op==="replace"?"rep-"+o.nmid:o.op==="remove"?"rm-"+o.mid:"out-"+o.date;
  const direct=S.access==="ok"&&S.mcp;
  if(S.db&&!S.dbReadOnly){
    const prev=MN.q[key]; MN.q[key]={_id:key,...o}; render(); refreshMenuSheets();
    return menuChain=menuChain.then(()=>dbWrite("menuQueue/"+key,"set",o)).then(ok=>{
      if(!ok){ if(prev) MN.q[key]=prev; else delete MN.q[key]; render(); refreshMenuSheets(); toast("That didn't save. Try again.",4000); return false; }
      processMenuQueue(); return true;
    });
  }
  MN.applied[key]={...o,t:Date.now()}; render();
  return menuChain=menuChain.then(()=>writeMenuOp(o)).then(()=>true).catch(err=>{ delete MN.applied[key]; render(); toast((err&&err.userMsg)||"That didn't save. Try again.",4000); return false; });
}
async function processMenuQueue(){
  if(MN.busy||S.access!=="ok"||!S.mcp||!S.db) return;
  const next=Object.values(MN.q).sort((a,b)=>(a.at||0)-(b.at||0))[0]; if(!next) return;
  MN.busy=true;
  try{
    await writeMenuOp(next);
    MN.applied[next._id]={...next,t:Date.now()};
    const cur=MN.q[next._id]; if(cur&&cur.at===next.at){ delete MN.q[next._id]; await dbWrite("menuQueue/"+next._id,"delete"); }
  }catch(e){ console.warn("menu sync failed",e); MN.busy=false; if(e&&e.userMsg) toast(e.userMsg,4000); return; }
  MN.busy=false; render(); setTimeout(processMenuQueue,300);
}
async function writeMenuOp(o){
  const who=roleName(o.by||S.role);
  for(let attempt=0; attempt<2; attempt++){
    const meta=await sheetMeta(RECIPES_SHEET); mustHave(meta,["Menu","Menu Log"]);
    const rows=await sheetVals(RECIPES_SHEET,"'Menu'!A:L");
    const sM=meta.ids["Menu"], sL=meta.ids["Menu Log"];
    const find=mid=>rows.findIndex((r,i)=>i>0&&r&&r[0]===mid);
    const del=i=>({deleteDimension:{range:{sheetId:sM,dimension:"ROWS",startIndex:i,endIndex:i+1}}});
    const line=x=>[x.mid,x.date,mnDayName(x.date),x.role,x.src,x.rid,x.name,who,"App",stampText(new Date(o.at||Date.now())),"",""];
    const req=[], logs=[];
    if(o.op==="add"){
      if(find(o.mid)<0){ req.push({appendCells:{sheetId:sM,rows:[rowData(line(o))],fields:"userEnteredValue"}}); logs.push(["Added",o.date,o.name,`${o.role} · ${o.src}`]); }
    } else if(o.op==="replace"){
      if(find(o.nmid)<0){
        const oi=find(o.mid); const old=oi>0?rows[oi][6]:(o.oldName||"");
        if(oi>0) req.push(del(oi));
        req.push({appendCells:{sheetId:sM,rows:[rowData(line({...o,mid:o.nmid}))],fields:"userEnteredValue"}});
        logs.push(old&&old===o.name&&o.src==="Recipe"?["Saved to our recipes",o.date,o.name,`${o.role}; now linked to recipe ${o.rid}`]:["Replaced",o.date,o.name,`${o.role}; replaced ${old||"(already removed)"}`]);
      }
    } else if(o.op==="remove"){
      const oi=find(o.mid); if(oi>0){ req.push(del(oi)); logs.push(["Removed",mnNorm(rows[oi][1])||o.date,rows[oi][6],pad(rows[oi],12)[3]]); }
    } else if(o.op==="outcome"){
      const names=[];
      rows.forEach((r,i)=>{ if(i>0&&r&&mnNorm(r[1])===o.date){ names.push(r[6]); if((pad(r,12)[11]||"")!==o.outcome) req.push({updateCells:{start:{sheetId:sM,rowIndex:i,columnIndex:11},rows:[{values:[cell(o.outcome)]}],fields:"userEnteredValue"}}); } });
      if(req.length) logs.push([o.outcome==="Made"?"Marked made":o.outcome==="Skipped"?"Marked skipped":"Cleared outcome",o.date,names.join(" + "),""]);
    }
    if(!req.length) return;
    const stamp=stampText(new Date());
    req.push({appendCells:{sheetId:sL,rows:logs.map(l=>rowData([stamp,who,"App",...l])),fields:"userEnteredValue"}});
    try{ await callS("update_spreadsheet",{spreadsheetId:RECIPES_SHEET,requests:req,writeControl:{requiredRevisionId:meta.rev}}); }
    catch(err){ if(isStale(err)&&attempt===0) continue; if(isStale(err)) throw {userMsg:"The recipe sheet was busy. It'll try again shortly."}; throw accessFail(err); }
    try{ await S.mcp.invalidate(SRV,"get_values"); }catch(x){}
    return;
  }
}

function searchResults(qs){
