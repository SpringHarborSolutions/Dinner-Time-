<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>Dinner Time!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-title" content="Dinner Time!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,0&family=Manrope:wght@400..700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap">
<style>
/* Dusk palette: charcoal evening; each person has a color (set from DT.people); greens and amber only for meaning.
   Layout: phone = one column + bottom nav; 600–1023 = one column ≤720; ≥1024 = rail + list 60% + panel 40%. */
:root{
  --bg:#1C1E21; --surface:#26292E; --surface-raised:#33363C; --border:#474B52;
  --text:#ECEDEA; --text-muted:#A9AEA8;
  --navy:#1F3A68; --navy-bright:#8FB0E8; --turquoise:#2EC4B6; --turquoise-ink:#0B1F1E;
  --sage:#9CB59A; --amber:#E3B34C; --clay:#E58A73;
  --person:var(--navy-bright); --season:#D98C4A;
  --font-display:"Fraunces",Georgia,serif; --font-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(0.2,0.8,0.2,1);
  --r-row:12px; --r-card:20px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F3EF; --surface:#FFFFFF; --surface-raised:#ECEBE6; --border:#D6D4CC;
    --text:#1C1E21; --text-muted:#565B57;
    --navy-bright:#1F3A68; --turquoise:#0E7A71; --turquoise-ink:#FFFFFF;
    --sage:#4F6B4A; --amber:#7F5609; --clay:#B04A33; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-raised:#ECEBE6; --border:#D6D4CC;
  --text:#1C1E21; --text-muted:#565B57;
  --navy-bright:#1F3A68; --turquoise:#0E7A71; --turquoise-ink:#FFFFFF;
  --sage:#4F6B4A; --amber:#7F5609; --clay:#B04A33; color-scheme:light;
}

html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:1rem;line-height:1.5;margin:0;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--turquoise);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);font-variation-settings:"SOFT" 100,"WONK" 0;font-weight:600;text-wrap:balance;margin:0}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100dvh}
.rail{display:none}
.main{min-width:0;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{width:100%;max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid transparent}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;min-height:60px}
.topbar .wrap{flex-wrap:wrap;row-gap:6px}.topbar .ttl{flex:1 1 13rem;min-width:0}.topbar .ttl>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar .hello{font-size:1.05rem;line-height:1.3;color:var(--text-muted);font-weight:600}.topbar h1{font-size:1.5rem;line-height:1.2;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:.875rem;font-weight:600;line-height:20px;background:var(--surface-raised);color:var(--text-muted);border:0;min-height:28px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.banners{display:flex;flex-direction:column;gap:8px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-row);background:var(--surface);border:1px solid var(--border);font-size:.9375rem}
.banner svg{flex:none;margin-top:2px}
.banner .b-body{flex:1;min-width:0}
.banner.warn svg{color:var(--amber)} .banner.err svg{color:var(--clay)} .banner.ok svg{color:var(--sage)}
.banner .b-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:999px;border:1px solid var(--border);background:var(--surface-raised);font-weight:600;font-size:1rem;transition:transform 120ms var(--ease),background 120ms}
.btn:active{transform:scale(.98)}
.btn.small{min-height:40px;padding:0 14px;font-size:.9375rem}
.btn.primary{background:var(--person-btn,var(--navy));color:var(--person-ink,#fff);border-color:transparent}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{background:none;border:0;padding:8px 4px;color:var(--text-muted);text-decoration:underline;font-size:.9375rem;min-height:44px}

/* ---------- views ---------- */
.view{padding-block:8px 24px;display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none!important}
.screen-title{font-size:2rem;line-height:2.25rem}
.sub{color:var(--text-muted);font-size:.875rem;line-height:1.25rem}

/* hero */
.hero{position:relative;height:32dvh;min-height:200px;max-height:340px;border-radius:var(--r-card);overflow:hidden;background:linear-gradient(#1F3A68,#1C1E21);margin-top:4px}
.hero canvas,.hero svg,.hero img.bake{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero img.bake{object-fit:cover;object-position:center}
.hero .hero-msg{position:absolute;left:16px;right:16px;bottom:14px;font-family:var(--font-display);font-size:1.125rem;color:#ECEDEA;text-shadow:0 1px 8px rgba(0,0,0,.6);pointer-events:none;opacity:0;transition:opacity 320ms}
.hero .hero-msg.show{opacity:1}
.greet{display:flex;flex-direction:column;gap:4px}
.greet h2{font-size:2rem;line-height:2.25rem}
.season-chip{color:var(--season)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cards .card.wide{grid-column:1/-1}
.cards .card:not(.wide){min-width:0}
.cards .card:not(.wide) .v{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cards .card:not(.wide) .k{min-width:0;overflow-wrap:anywhere}
@media (max-width:399px){.cards{gap:10px}.cards .card:not(.wide){padding:14px}.cards .card:not(.wide) .k{gap:8px;font-size:1rem}}
/* ---------- home tiles ---------- */
:root{--t-grocery:#9CCB98;--t-extra:#EBA26C;--t-freezer:#93BBF0;--t-recipes:#EE9DB3;--t-gear:#B7A7F2;--t-maint:#D9C27F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--t-grocery:#3E7A43;--t-extra:#A3562A;--t-freezer:#2C62A6;--t-recipes:#A6436A;--t-gear:#6650B6;--t-maint:#7A5F14}}
:root[data-theme="light"]{--t-grocery:#3E7A43;--t-extra:#A3562A;--t-freezer:#2C62A6;--t-recipes:#A6436A;--t-gear:#6650B6;--t-maint:#7A5F14}
.tile{--accent:var(--sage)}
.tile[data-acc="grocery"]{--accent:var(--t-grocery)}.tile[data-acc="extra"]{--accent:var(--t-extra)}.tile[data-acc="freezer"]{--accent:var(--t-freezer)}
.tile[data-acc="recipes"]{--accent:var(--t-recipes)}.tile[data-acc="gear"]{--accent:var(--t-gear)}.tile[data-acc="maint"]{--accent:var(--t-maint)}
.cards .tile{position:relative;overflow:hidden;gap:0;padding:14px 14px 15px;min-height:0;border-radius:22px;
  background:var(--surface);
  background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 17%,var(--surface)) 0%,var(--surface) 62%);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 18%,transparent),0 1px 2px rgba(0,0,0,.18);
  transition:transform 140ms var(--ease),box-shadow 140ms}
button.tile:active{transform:scale(.97);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.t-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;min-width:0}
.t-ico{flex:none;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
.t-ico svg{stroke-width:2}
.t-stat{display:inline-flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:.8125rem;font-weight:700;color:var(--text-muted);line-height:1.25rem;margin-top:7px}
.t-stat b{font-family:var(--font-body);font-weight:800;font-size:.8125rem;line-height:inherit;color:var(--text);font-variant-numeric:tabular-nums}
.t-stat b.dim{color:var(--text-muted)}
.t-stat>span{font-weight:600;color:var(--text-muted)}
.t-stat b.t-over,.t-stat b.t-over+span{color:var(--clay)} .t-stat b.t-soon,.t-stat b.t-soon+span{color:var(--amber)}
.t-stat b.age-a2,.t-stat b.age-a2+span{color:var(--amber)} .t-stat b.age-a3,.t-stat b.age-a3+span{color:var(--clay)}
.t-ok{display:inline-flex;align-items:center;gap:3px;font-weight:700;color:var(--accent)}
.t-ok svg{width:14px;height:14px;stroke-width:2.75}
.t-name{margin-top:auto;padding-top:16px;font-family:var(--font-display);font-variation-settings:"SOFT" 100;font-weight:600;font-size:1.375rem;line-height:1.2;letter-spacing:-.01em;overflow-wrap:anywhere}
.t-sub{margin-top:3px;font-size:.875rem;line-height:1.3;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:2.6em}
.t-star{color:var(--amber);font-weight:700}
@media (max-width:379px){.cards .tile{padding:12px 12px 13px}.t-ico{width:34px;height:34px;border-radius:11px}.t-name{font-size:1.25rem}}
@media (min-width:600px){.cards .tile{min-height:156px;padding:16px 16px 17px}.t-name{font-size:1.5rem}}
#view-home .topbar{position:static;background:none;border:0}
#view-home .topbar .wrap{padding-inline:0;padding-block:4px 0;min-height:0}
.card{background:var(--surface);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;width:100%;min-height:56px}
button.card:active{background:var(--surface-raised);transform:scale(.98)}
.card .k{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.0625rem}
.card .k svg{color:var(--sage)}
.card .v{color:var(--text-muted);font-size:.9375rem}
.card .big{font-family:var(--font-display);font-size:1.75rem;line-height:2rem;font-variant-numeric:tabular-nums}
.trip .leafs{display:flex;flex-wrap:wrap;gap:6px}
.trip .leafs span{font-size:.875rem;border-radius:999px;padding:2px 10px;background:var(--surface-raised);color:var(--sage)}

/* list */
.listhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.listhead .screen-title{flex:1;min-width:0}
.together{display:flex;align-items:center;gap:8px;font-size:.9375rem;color:var(--text-muted);min-height:40px}
.together .leafbtn{border:1px solid var(--border);background:var(--surface);border-radius:999px;min-height:40px;padding:0 12px;display:inline-flex;align-items:center;gap:6px}
.aisle{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tbh,60px));z-index:5;background:var(--bg);height:40px;display:flex;align-items:center;justify-content:space-between;font-family:var(--font-display);font-weight:600;font-size:1.125rem;line-height:1.5rem}
.aisle .n{font-family:var(--font-body);font-size:.875rem;color:var(--text-muted);font-weight:700}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 12px;border-radius:var(--r-row);background:var(--surface);position:relative;user-select:none;-webkit-user-select:none;transition:background 120ms}
.row:active{background:var(--surface-raised)}
.row input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px}
.row input:focus-visible ~ .tap,.fcard input:focus-visible ~ .tap{outline:3px solid var(--turquoise);outline-offset:2px}
.row .tap{position:absolute;inset:0;border-radius:inherit;cursor:pointer}
.row .body{flex:1;min-width:0;pointer-events:none}
.row .name{font-size:1.1875rem;line-height:1.625rem;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .notes{font-size:.9375rem;color:var(--text-muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.row .meta{font-size:.875rem;color:var(--text-muted);font-weight:500;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.checked .name{text-decoration:line-through;text-decoration-thickness:2px;color:var(--text-muted)}
.row.pending{background:transparent;outline:1.5px dashed var(--sage);outline-offset:-1.5px}
.row.pending .newtag{color:var(--sage);font-weight:700}
.row .waiting{color:var(--amber);font-weight:600}
.leaf{flex:none;width:28px;height:28px;position:relative;pointer-events:none}
.leaf svg{width:28px;height:28px;display:block}
.leaf .fill{fill:var(--turquoise);transform-origin:50% 100%;transform:scale(0);transition:transform 220ms var(--ease)}
.leaf .tick{stroke:var(--turquoise-ink);opacity:0;transition:opacity 220ms}
.row.checked .leaf .fill,.fcard.sel .leaf .fill{transform:scale(1)}
.row.checked .leaf .tick,.fcard.sel .leaf .tick{opacity:1}
.leaf .outline{stroke:var(--text-muted)}
.pdot{display:inline-flex;align-items:center;gap:5px;font-size:.875rem;font-weight:700}
.pdot::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.p-unk{color:var(--text-muted)}
.aislechip{position:relative;z-index:2;flex:none;border-radius:999px;border:1px solid var(--border);background:var(--surface-raised);min-height:32px;padding:0 12px;font-size:.875rem;font-weight:600;color:var(--text-muted);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aislechip.unsorted{color:var(--amber);border-color:var(--amber)}
.editbtn{position:relative;z-index:2;flex:none;border:0;background:none;min-height:44px;min-width:44px;border-radius:999px;color:var(--text-muted)}
.basket-h{font-family:var(--font-display);font-size:1.125rem;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
.addbtn{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;background:var(--surface-raised);border:0;font-weight:700;font-size:1rem}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px 8px;color:var(--text-muted)}
.empty svg{width:180px;max-width:100%;height:auto}
.empty p{font-family:var(--font-display);font-size:1.25rem;color:var(--text);margin:0}
.skel{height:56px;border-radius:var(--r-row);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-raised) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.6s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}

/* freezer */
.fgrid{display:grid;grid-template-columns:1fr;gap:10px}
.fcard{position:relative;background:var(--surface);border-radius:var(--r-card);padding:14px 16px 14px 52px;min-height:72px;display:flex;flex-direction:column;gap:4px;border:2px solid transparent;text-align:left;width:100%}
.fcard .leaf{position:absolute;left:14px;top:16px}
.fcard.sel{border-color:var(--person)}
.fcard.pickday{box-shadow:inset 0 0 0 2px var(--amber)}
.fcard .name{font-weight:700;font-size:1.0625rem;line-height:1.5rem;overflow-wrap:anywhere}
.fcard .fmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.875rem;color:var(--text-muted);align-items:center}
.age{border-radius:999px;padding:1px 9px;font-weight:700;font-size:.8125rem;line-height:1.25rem;border:1px solid currentColor}
.age.a1{color:var(--sage)} .age.a2{color:var(--amber)} .age.a3{color:var(--clay)}
.groupt{font-family:var(--font-display);font-size:1.125rem;margin-top:6px}
.search{width:100%;min-height:48px;border-radius:var(--r-row);border:1px solid var(--border);background:var(--surface);padding:0 14px;font-size:1rem}
/* ---------- freezer (rebuilt to match gear) ---------- */
#list-freezer{display:flex;flex-direction:column;gap:14px}
#fz-top:empty{display:none}
.fz-card{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--t-freezer) 20%,transparent);background:var(--surface);background:radial-gradient(120% 70% at 0% 0%,color-mix(in srgb,var(--t-freezer) 13%,var(--surface)) 0%,var(--surface) 60%)}
.fz-card .gr-card-h{align-items:flex-end}
.fz-card .gr-card-h .sub{display:block;margin-top:1px}
.fz-row{position:relative;display:flex;align-items:center;border-radius:14px;transition:background 120ms}
.fz-row.sel{background:color-mix(in srgb,var(--person) 11%,transparent)}
.gr-inset>.fz-row+.fz-row::before{content:"";position:absolute;top:0;right:12px;left:72px;border-top:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.fz-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 4px 8px 12px;border:0;background:none;text-align:left;border-radius:14px;color:inherit}
.fz-open:active{background:var(--surface-raised)}
.fz-open .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fz-open .nm{font-weight:700;font-size:1rem;line-height:1.35rem;display:flex;align-items:baseline;gap:6px;min-width:0}
.fz-open .nm>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz-open .mk{font-size:.875rem;line-height:1.2rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fz-x{flex:none;font-weight:800;font-size:.8125rem;color:var(--t-freezer);font-variant-numeric:tabular-nums;padding:0 7px;border-radius:999px;background:color-mix(in srgb,var(--t-freezer) 15%,transparent);line-height:1.25rem}
.fz-age{--c:var(--text-muted);flex:none;width:48px;height:48px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.fz-age small{display:block;font-size:.625rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.85;margin-top:3px}
.fz-age.a1{--c:var(--sage)} .fz-age.a2{--c:var(--amber)} .fz-age.a3{--c:var(--clay)}
.fz-age.none svg{width:20px;height:20px}
.fz-pick{flex:none;width:52px;height:52px;margin-right:4px;border:0;background:none;border-radius:999px;display:grid;place-items:center;position:relative}
.fz-pick:active{background:var(--surface-raised)}
.fz-row.sel .leaf .fill{transform:scale(1)} .fz-row.sel .leaf .tick{opacity:1}
.fz-pn{position:absolute;top:5px;right:5px;min-width:18px;height:18px;border-radius:999px;background:var(--person);color:var(--bg);font-size:.6875rem;font-weight:800;line-height:18px;text-align:center;padding:0 4px;font-variant-numeric:tabular-nums}
:root[data-role] .fz-pn{color:var(--person-ink2,var(--bg))}
.fz-wait{font-size:.75rem;font-weight:700;color:var(--amber)}
#view-freezer .rx-chip{border:0;background:var(--surface);min-height:36px;padding:0 13px;font-size:.875rem}
#view-freezer .rx-chip[aria-pressed="true"]{background:color-mix(in srgb,var(--t-freezer) 28%,var(--surface));color:var(--text)}
#view-freezer .rx-chip .n{opacity:.55}
.fz-tray{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-row);background:color-mix(in srgb,var(--person) 10%,var(--surface));font-size:.9375rem}
.fz-tray b{font-variant-numeric:tabular-nums}
.fz-tray .linkbtn{margin-left:auto;min-height:36px;padding:4px}
.fz-recent{background:var(--surface);border-radius:var(--r-card);padding:2px 4px}
.fz-recent summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:700;color:var(--text-muted)}
.fz-recent summary::-webkit-details-marker{display:none}

/* save bar */

/* side panel (tablet landscape) */

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:var(--r-card) var(--r-card) 0 0;max-height:85dvh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform 320ms var(--ease);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.show{transform:translateY(var(--dy,0px))}
.sheet.dragging{transition:none!important}
.sheet .handle,.sheet .sh-head{touch-action:none}

.field{display:flex;flex-direction:column;gap:6px}

.warnline{color:var(--amber);font-size:.9375rem;display:flex;flex-direction:column;gap:8px}
.aislepick{display:flex;flex-direction:column;gap:6px}
.aislepick button{min-height:56px;border-radius:var(--r-row);border:1px solid var(--border);background:var(--bg);text-align:left;padding:0 16px;font-weight:600;font-size:1rem;display:flex;justify-content:space-between;align-items:center}

.rv-item{display:flex;align-items:center;gap:12px;min-height:48px;padding:6px 0;border-bottom:1px solid var(--border)}

.hold{position:relative;min-height:56px;padding:0 26px;border-radius:999px;border:0;font-weight:700;font-size:1.0625rem;background:var(--surface-raised);color:var(--text);touch-action:none;-webkit-user-select:none;user-select:none;overflow:hidden;--p:0;display:inline-flex;align-items:center;gap:12px}

.hold.holding{box-shadow:0 0 0 2px var(--person)}
.vine{height:6px;border-radius:3px;background:var(--surface-raised);overflow:hidden}

.gr-filebtn{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px 0 14px;border-radius:var(--r-row);background:var(--bg);border:1px solid var(--border);color:var(--text);font-weight:600;text-align:left;width:100%}

/* ---------- Android keyboard fixes ---------- */
html,body{overflow-x:clip}
:root{--kb:0px;--vvh:100dvh}
html.sheet-open,html.sheet-open body{overflow:hidden;overscroll-behavior:none}
@media (max-width:1023px){
  html.android .sheet{bottom:var(--kb);max-height:min(85dvh,calc(var(--vvh) - 16px));transition:transform 320ms var(--ease),bottom 160ms var(--ease)}
  /* keyboard up but the browser can't tell us its height: dock the form at the top of the screen */
  html.android.kb-top:not(.kb-measured) .sheet{top:calc(env(safe-area-inset-top,0px) + 8px);bottom:auto;max-height:48dvh;border-radius:var(--r-card)}
  html.android.kb-top:not(.kb-measured) .sheet .handle{display:none}
  html.android.kb-top:not(.kb-measured) .sheet .sh-head{padding-top:12px}
  /* the app shrank the page to the space above the keyboard: use all of it */
  html.android.kb-top.kb-resized .sheet{max-height:calc(var(--vvh) - 12px)}
  html.android.kb-top .sheet .sh-head{padding-bottom:4px}
  html.android.kb-top .sheet .sh-head h2{font-size:1.25rem}
  html.android.kb-top .sheet .sh-body{gap:10px;padding-bottom:10px}
  html.android.kb-top .sheet .sh-foot{padding-top:8px;padding-bottom:10px}
  html.android.kb-top .bnav,html.android.kb-top .savebar{visibility:hidden}
  /* forms: full screen while the keyboard is down; the rules above take over when it's up */
  html:not(.kb-top) .sheet.full{top:0;bottom:0;max-height:none;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
  html:not(.kb-top) .sheet.full .handle{display:none}
  html:not(.kb-top) .sheet.full .sh-head{padding-top:14px}
  .sheet.full .sh-body{flex:1 1 auto}
}
@media (min-width:600px) and (max-width:1023px){
  html:not(.kb-top) .sheet.full{top:calc(env(safe-area-inset-top,0px) + 24px);border-radius:var(--r-card) var(--r-card) 0 0;padding-top:0}
}

/* tablet portrait */
@media (min-width:600px){
  .fgrid{grid-template-columns:1fr 1fr}
  .sheet{left:50%;right:auto;width:560px;max-width:100%;transform:translate(-50%,100%)}
  .sheet.show{transform:translate(-50%,var(--dy,0px))}
  .screen-title{font-size:2.5rem;line-height:2.75rem}
}
/* tablet landscape */
@media (min-width:1024px){
  .app{grid-template-columns:88px minmax(0,3fr) minmax(0,2fr)}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;background:var(--surface);padding:calc(env(safe-area-inset-top,0px) + 16px) 8px 16px max(8px,env(safe-area-inset-left,0px));border-right:1px solid var(--border)}
  .rail .navbtn{min-height:72px;border-radius:16px}
  .bnav,.savebar{display:none}
  .main{padding-bottom:24px}
  .wrap{max-width:none}
  .hero{height:160px;min-height:160px}
  .side{display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100dvh;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 76px) max(16px,env(safe-area-inset-right,0px)) 24px 16px;border-left:1px solid var(--border)}
  .side h2{font-size:1.25rem}
  .sheet{top:50%;bottom:auto;border-radius:var(--r-card);transform:translate(-50%,-40%);opacity:0;transition:transform 320ms var(--ease),opacity 320ms;max-height:80dvh}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .sheet .handle{display:none}
  .fgrid{grid-template-columns:1fr 1fr}
}

<script>
"use strict";
/* =====================================================================
   BRIDGE RUNTIME — lets this same page run outside Claude (for example as a
   ChatGPT Site). Used only when there is no window.claude and DT.bridge.url
   is set. The bridge is the household's own Google Apps Script web app
   (apps-script/bridge.gs): it reads and writes the four sheets, keeps a small
   shared key/value store (checks, people, settings, queues) in the
   "App State" tab of the Shopping spreadsheet, and stores uploaded photos in
   the 29 Site Files folder. Every call carries the household's bridge key.
   ===================================================================== */
function DTBridgeRuntime(cfg){
  const LOCAL_ONLY=/^(snapshots|rxsnap|gsnap|gearImg|gearPdf|tn_)/;   // the bridge reads sheets live; no need to share copies
  const POLL_MS=15000;
  async function call(tool,input){
    let r;
    try{ r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:cfg.key,tool,input}),redirect:"follow"}); }
    catch(e){ throw {code:"server_unavailable",retryable:true,message:String(e&&e.message||e)}; }
    let j=null; try{ j=await r.json(); }catch(e){ throw {code:"upstream_error",message:"bad bridge reply"}; }
    if(!j||!j.ok){ const er=(j&&j.error)||{}; throw {code:er.code||"tool_error",message:er.message||"bridge error",result:er}; }
    return j.payload;
  }
  /* ---------- mcp ---------- */
  const watchers=new Set();
  const mcp={
    async callTool(server,tool,input){ return {payload: await call((server==="Google Drive"?"drive.":"sheets.")+tool,input)}; },
    watchTool(server,tool,input,cb,opts){
      const w={server,tool,input,cb,stopped:false,t:0};
      const run=async()=>{ if(w.stopped) return; try{ const p=await call("sheets."+tool,input); cb({type:"data",result:{payload:p,cache:{storedAt:Date.now()}}}); }catch(e){ cb({type:"error",error:e}); }
        clearTimeout(w.t); w.t=setTimeout(run,(opts&&opts.refetchInterval)||60000); };
      w.run=run; watchers.add(w); run();
      const stop=()=>{ w.stopped=true; clearTimeout(w.t); watchers.delete(w); }; stop.unsubscribe=stop; return stop;
    },
    async invalidate(server,tool){ for(const w of watchers) if(!tool||w.tool===tool){ clearTimeout(w.t); w.run(); } },
    async listTools(){ return {fileArgs:false}; }
  };
  /* ---------- db (shared key/value through the bridge) ---------- */
  const cache=new Map();            // key -> {data, version}
  const subs=new Set();             // {path, cb, order, limit}
  const isLocal=k=>LOCAL_ONLY.test(k);
  const kids=(path)=>{ const pre=path+"/"; const out=[]; for(const [k,v] of cache) if(k.startsWith(pre)&&!k.slice(pre.length).includes("/")) out.push({id:k.slice(pre.length),data:v.data}); return out; };
  const snap=(sub)=>{ let d=kids(sub.path); if(sub.order){ const [f,dir]=sub.order; d.sort((a,b)=>((a.data[f]>b.data[f])?1:(a.data[f]<b.data[f])?-1:0)*(dir==="desc"?-1:1)); } if(sub.limit) d=d.slice(0,sub.limit); return {metadata:{fromCache:false},docs:d.map(x=>({id:x.id,data:()=>x.data}))}; };
  const notify=(key)=>{ for(const s of subs) if(!key||key.startsWith(s.path+"/")) try{ s.cb(snap(s)); }catch(e){} };
  const roots=new Set();
  async function pull(root){ try{ const rows=await call("kv.list",{prefix:root+"/"}); const seen=new Set();
      for(const r of rows||[]){ seen.add(r.key); const cur=cache.get(r.key); if(!cur||cur.version!==r.version) cache.set(r.key,{data:r.data,version:r.version}); }
      for(const k of [...cache.keys()]) if(k.startsWith(root+"/")&&!seen.has(k)&&!isLocal(k)) cache.delete(k);
      notify(root+"/"); }catch(e){ for(const s of subs) if(s.path.startsWith(root)&&s.err) try{ s.err(e); }catch(_){} } }
  setInterval(()=>{ if(document.visibilityState==="visible") roots.forEach(pull); },POLL_MS);
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") roots.forEach(pull); });
  function collection(path){
    const make=(order,limit)=>({
      orderBy:(f,dir)=>make([f,dir||"asc"],limit), limit:(n)=>make(order,n),
      onSnapshot(cb,err){ const s={path,cb,err,order,limit}; subs.add(s); const root=path.split("/")[0];

/* ---------------- data views ---------------- */
function listRows(list){
  const src = S.live[list] ? S.live[list].rows : (S.snaps[list] ? S.snaps[list].rows : null);
  if(!src) return null;
  if(list==="freezer") return fzApplyEdits(src.map((r,i)=>({v:pad(r,15), idx:i+1})).filter(x=>x.v[0]));
  return src.map((r,i)=>({v:pad(r,5), idx:i+1})).filter(x=>x.v[0]||x.v[1]||x.v[2]||x.v[3]||x.v[4]).map(x=>({...x,key:rowKey(x.v)}));
}
function sourceInfo(list){ if(S.live[list]) return {kind:"live", at:S.live[list].at}; if(S.snaps[list]) return {kind:"snap", at:S.snaps[list].readAt}; return null; }
function openCount(list){ const r=listRows(list); if(!r) return 0; const ch=S.checks[list]||{}; const p=Object.keys(S.pending[list]||{}).length; return r.filter(x=>!ch[x.key]).length + p; }
function isPickDay(){ if(!PICK_DAY) return false; const p=ctParts(new Date()); return p.weekday===PICK_DAY.slice(0,3) && +p.hour>=12; }
function pickDayItems(){ const f=freezerItems(); if(!f) return []; return f.dated.filter(x=>/^y(es)?$/i.test(x.pickday.trim())).slice(0,4); }

function lastSyncAt(){ let t=0; for(const l of ["shopping","extra"]){ const s=sourceInfo(l); if(s&&s.at) t=Math.max(t,s.at); } return t; }
function syncState(){
  const q=Object.values(S.queue||{});
  const waiting=q.filter(x=>x.status==="waiting"||x.status==="applying").length;
  const failed=q.filter(x=>x.status==="failed"&&!lsGet("dt.qdismiss."+x._id,false)).length;
  const at=lastSyncAt(), fresh=at&&(Date.now()-at)<3*3600e3;
  if(failed) return {k:"err",t:"Sync problem",at};
  if((S.dbSlow&&!S.dbReady)||(S.access==="checking"&&!at)) return {k:"busy",t:"Syncing…",at};
  if(waiting) return {k:"wait",t:"Not synced",at,waiting};
  if(S.access==="ok"||fresh) return {k:"ok",t:"Synced",at};
  return {k:"wait",t:"Not synced",at};
}
function renderAccessChip(){
  const c=document.getElementById("accesschip"), st=syncState();
  c.hidden=false; c.className="chip syncchip "+st.k;
  c.querySelector(".t").textContent=st.t;
  c.setAttribute("aria-label",st.t+(st.at?", lists updated "+clockCT(st.at):"")+". Tap for details.");
  if(syncSheetOpen) fillSyncSheet();
}
function lastReadText(list){ const s=sourceInfo(list); return s&&s.at?clockCT(s.at):"earlier"; }
var syncSheetOpen=false;
function syncDetailHTML(){
  const st=syncState();
  const sum = st.k==="ok" ? `Everything's in sync.${st.at?` Lists last updated ${esc(clockCT(st.at))}.`:""}`
    : st.k==="busy" ? "Connecting to the shared lists…"
    : st.k==="err" ? "A save didn't make it to the sheet."
    : `Not everything has reached the sheet yet.${st.at?` Lists last updated ${esc(clockCT(st.at))}.`:""}`;
  const items=syncBanners();
  return `<p class="sync-sum">${sum}</p>${items.length?`<div class="banners">${items.join("")}</div>`:""}`;
}
function fillSyncSheet(){ const b=document.querySelector("#sheetroot .sheet .sh-body"); if(b) b.innerHTML=syncDetailHTML(); else syncSheetOpen=false; }
function openSyncSheet(){
  syncSheetOpen=true;
  openSheet({title:"Sync", body:syncDetailHTML(), focus:"[data-close]", swipe:true, mount(el){
    el.addEventListener("click",async e=>{ if(e.target.closest("[data-act]")){ await bannerAct(e); } });
    const root=document.getElementById("sheetroot"); const obs=new MutationObserver(()=>{ if(!root.querySelector(".sheet")){ syncSheetOpen=false; obs.disconnect(); } }); obs.observe(root,{childList:true});
  }});
}

function bannerHTML(kind,ic,body,actions=""){ return `<div class="banner ${kind}">${icon(ic,20)}<div class="b-body">${body}${actions?`<div class="b-actions">${actions}</div>`:""}</div></div>`; }
/* sync-related details: shown only in the Sync sheet, not on the page */
function syncBanners(){
  const out=[], b=bannerHTML;
  if(S.dbSlow && !S.dbReady) out.push(b("warn","sync","Still connecting… your lists will appear as soon as the shared data answers."));
  if(S.access==="none") out.push(b("warn","alert",`This phone can't reach the sheet yet. Your checks still sync; saves will wait for a phone that can.${S.accessCode==="server_not_connected"?" To fix it, add Google Sheets in Claude Settings → Connectors, then come back.":""}`));
  if(S.access==="reauth") out.push(b("warn","alert","Reconnect Google Sheets in Claude Settings → Connectors. Until then, saves wait for a phone that can reach the sheet."));
  if(S.access==="approval") out.push(b("warn","alert","Google Sheets needs your OK before this page can read the lists.",`<button class="btn small primary" data-act="connect">Allow Google Sheets</button>`));
  if(S.access==="off") out.push(b("warn","alert","Google Sheets is turned off for this page. Checks still sync; saves will wait.",`<button class="btn small" data-act="perms">Open permissions</button>`));
  if(S.access==="select") out.push(b("warn","alert","Choose which Google Sheets account to use when Claude asks.",`<button class="btn small" data-act="connect">Try again</button>`));
  if(S.access==="down") out.push(b("err","alert",`Can't reach the sheet. Showing the list from ${esc(lastReadText(S.view==="home"?"shopping":S.view))}.`,`<button class="btn small" data-act="connect">Retry</button>`));
  // queue status
  const q=Object.values(S.queue);
  const waiting=q.filter(x=>x.status==="waiting"||x.status==="applying");
  if(waiting.length) out.push(b("warn","sync",`${waiting.length===1?"1 save is":waiting.length+" saves are"} waiting to sync to the sheet.${S.access==="ok"?" Applying it now.":" It goes through when a phone that can reach the sheet opens Dinner Time!."}`));
  const failedQ=q.filter(x=>x.status==="failed" && !lsGet("dt.qdismiss."+x._id,false));
  for(const f of failedQ) out.push(b("err","alert",`A waiting save couldn't reach the sheet: ${esc(f.result&&f.result.message||"try again from the list")}.`,`<button class="btn small" data-act="qretry" data-id="${esc(f._id)}">Try again</button><button class="btn small ghost" data-act="qdismiss" data-id="${esc(f._id)}">Dismiss</button>`));
  return out;
}
function renderBanners(){
  const out=[], b=bannerHTML;
  // stale checks
  const stale=staleChecks();
  if(stale.length && (S.view==="shopping"||S.view==="extra")) out.push(b("warn","alert","Checks from last night — still shopping?",`<button class="btn small" data-act="keepstale">Keep</button><button class="btn small" data-act="clearstale">Clear</button>`));
  if(S.dbReadOnly) out.push(b("warn","alert",`You can look, but this account can't change the shared list. Ask ${OWNER_NAME} to invite you as an Editor.`));
  if(false) out.push(b("ok","leaf","Keep Dinner Time! one tap away: copy this page's link with the Share button above, open it in Chrome (Android) or Safari (iPhone) while signed in to Claude, then use ⋮ → Add to Home screen (Chrome) or Share → Add to Home Screen (Safari).",`<button class="btn small" data-act="pintip">Got it</button>`));
  document.getElementById("banners").innerHTML=out.join("");
}
async function bannerAct(e){
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="connect") connectSheets(true);
  if(a==="perms"){ try{ await S.perms.manage(); connectSheets(true); }catch(err){ toast("Open the artifact's Permissions menu to turn Google Sheets back on."); } }
  if(a==="pintip"){ lsSet("dt.pintip",true); render(); }
  if(a==="keepstale"){ const k=lsGet("dt.keepstale",{}); for(const s of staleChecks()) k[s.list+"/"+s.key]=s.at; lsSet("dt.keepstale",k); render(); }
  if(a==="clearstale") confirmClearStale();
  if(a==="qdismiss"){ lsSet("dt.qdismiss."+t.dataset.id,true); render(); }
  if(a==="qretry"){ const d=S.queue[t.dataset.id]; if(d){ try{ await S.db.doc("saveQueue/"+t.dataset.id).update({status:"waiting"}); }catch(err){ toast("Couldn't requeue that save."); } } }
  if(syncSheetOpen) fillSyncSheet();
}

function personTag(byId){ const r=roleOf(byId); return `<span class="pdot ${r?"p-"+r:"p-unk"}">${esc(roleName(r))}</span>`; }
function queuedKeys(list){ const s=new Set(); for(const q of Object.values(S.queue)) if(q.list===list && (q.status==="waiting"||q.status==="applying")){ for(const r of (q.payload&&q.payload.removes)||[]) s.add(r.key); for(const a of (q.payload&&q.payload.adds)||[]) s.add("p:"+a.tempId); } return s; }

function renderList(list){
  const host=document.getElementById("list-"+list);
  const rows=listRows(list);
  if(!rows){ host.innerHTML=`<div class="rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`; return; }
  const before=flipBefore(host);
  const ch=S.checks[list]||{}; const pend=Object.entries(S.pending[list]||{}).map(([id,p])=>({id,...p}));
  const q=queuedKeys(list);
  const open=rows.filter(r=>!ch[r.key]); const done=rows.filter(r=>ch[r.key]).sort((a,b)=>(ch[b.key].checkedAt||0)-(ch[a.key].checkedAt||0));
  const byDate=(a,b)=>((parseDate(a.v[1])||{t:Infinity}).t-(parseDate(b.v[1])||{t:Infinity}).t) || a.idx-b.idx;
  const rowHtml=(r,checked)=>{
    const c=ch[r.key]; const a=list==="shopping"?aisleFor(r.v[0]):null;
    const meta=[]; if(r.v[3]) meta.push(esc(r.v[3])); if(r.v[1]) meta.push(esc(shortDate(r.v[1])));
    return `<div class="row ${checked?"checked":""}" data-key="${esc(r.key)}">
      <input type="checkbox" id="ck-${list}-${esc(safeSeg(r.key))}" ${checked?"checked":""} aria-label="${esc(r.v[0])}${checked?", in the basket":""}">
      <label class="tap" for="ck-${list}-${esc(safeSeg(r.key))}" data-toggle="${esc(r.key)}"></label>
      <span class="leaf">${LEAFBOX}</span>
      <div class="body"><div class="name">${esc(r.v[0])}</div>${r.v[2]?`<div class="notes">${esc(r.v[2])}</div>`:""}<div class="meta">${meta.join(" · ")}${c?` ${personTag(c.checkedBy)}`:""}${q.has(r.key)?` <span class="waiting">Saved, waiting to sync</span>`:""}</div></div>
      ${a?`<button class="aislechip ${a==="Not sorted"?"unsorted":""}" data-aisle="${esc(r.v[0])}" aria-label="Aisle: ${esc(a)}. Change aisle">${a==="Not sorted"?"Pick an aisle":esc(a)}</button>`:""}
    </div>`;
  };
  const pendHtml=p=>{ const a=list==="shopping"?(AISLES.includes(p.aisle)?p.aisle:aisleFor(p.item)):null; return `<div class="row pending" data-key="p:${esc(p.id)}">
      <span class="leaf" aria-hidden="true">${icon("plus",28)}</span>
      <div class="body"><div class="name">${esc(p.item)}</div>${p.notes?`<div class="notes">${esc(p.notes)}</div>`:""}<div class="meta"><span class="newtag">${q.has("p:"+p.id)?"":"Adding…"}</span> ${personTag(p.addedBy)}${q.has("p:"+p.id)?` <span class="waiting">Saved, waiting to sync</span>`:""}</div></div>
      ${a?`<span class="aislechip" aria-hidden="true">${esc(a)}</span>`:""}
      <button class="editbtn" data-editp="${esc(p.id)}" aria-label="Edit ${esc(p.item)}">${icon("edit",20)}</button></div>`; };
  let html="";
  if(!open.length && !pend.length && !done.length){
    html=`<div class="empty">${EMPTY_ART}<p>Nothing needed. All caught up.</p><button class="addbtn" data-add="${list}">${icon("leaf",20)} Add an item</button></div>`;
  } else {
    if(list==="shopping"){
      const groups={}; for(const r of open){ const a=aisleFor(r.v[0]); (groups[a]=groups[a]||{rows:[],pend:[]}).rows.push(r); }
      for(const p of pend){ const a=AISLES.includes(p.aisle)?p.aisle:aisleFor(p.item); (groups[a]=groups[a]||{rows:[],pend:[]}).pend.push(p); }
      for(const a of AISLES){ const g=groups[a]; if(!g) continue; g.rows.sort(byDate); g.pend.sort((x,y)=>(x.createdAt||0)-(y.createdAt||0));
        html+=`<div class="aisle"><span>${esc(a)}</span><span class="n num">${g.rows.length+g.pend.length}</span></div><div class="rows">${g.rows.map(r=>rowHtml(r,false)).join("")}${g.pend.map(pendHtml).join("")}</div>`; }
    } else {

      html+=`<div class="rows">${open.map(r=>rowHtml(r,false)).join("")}${pend.map(pendHtml).join("")}</div>`;
      if(!open.length && !pend.length) html+=`<div class="empty">${EMPTY_ART}<p>Nothing needed. All caught up.</p></div>`;
    }
    if(done.length) html+=`<div class="basket-h"><span>In the basket</span><span class="sub num">${done.length}</span></div><div class="rows">${done.map(r=>rowHtml(r,true)).join("")}</div>`;
  }
  const src=sourceInfo(list);
  if(src && src.kind==="snap") html+=`<p class="sub">Showing the list from ${esc(src.at?clockCT(src.at):"earlier")}.</p>`;
  host.innerHTML=html;
  flipAfter(host,before);
}
function flipBefore(host){ const m=new Map(); if(REDUCED.matches) return m; host.querySelectorAll("[data-key]").forEach(el=>m.set(el.dataset.key,el.getBoundingClientRect().top)); return m; }
function flipAfter(host,before){ if(!before.size) return; host.querySelectorAll("[data-key]").forEach(el=>{ const t=before.get(el.dataset.key); if(t==null) return; const dy=t-el.getBoundingClientRect().top; if(Math.abs(dy)>2 && el.animate) el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],{duration:220,easing:"cubic-bezier(0.2,0.8,0.2,1)"}); }); }

["shopping","extra"].forEach(list=>{

/* =====================================================================
   FREEZER — workbook IDS().freezer, tab Inventory A..O:
     0 Item ID 1 Item 2 Pick-day protein 3 Status 4 Label date 5 Quantity
     6 Quantity unit 7 Weight (lb) 8 Location 9 Date type 10 Preparation
     11 Removed to thaw 12 Reported by 13 Source notes 14 Update notes
   Identical packages (same item, date, size, place) show as one row "×N".
   Adds, edits, removals and put-backs go to the shared queue fzQueue/<op>-<id>;
   a page that can reach the sheet (or the hourly run) writes them. A pull from a
   page with Sheets access writes at once (writePull); without it, it is queued too.
   Item IDs are permanent: a new one is always above every ID in Inventory and
   Change Log, so an old ID is never reused. Reported by is the person who reported it.
   ===================================================================== */
const FZ = { q:{}, applied:{}, busy:false, search:"", cat:"all", openId:null, n:{}, memo:null };
const FZ_APPLIED_MS = 5*60*1000;
const FZ_CATS = [
  ["Sausage & bacon", /\b(sausages?|brats?|bratwursts?|bacon|hot ?dogs?|pepperoni|kielbasa|franks?|salami)\b/i],
  ["Fish & seafood", /\b(fish|bass|salmon|bluegills?|shrimp|walleye|pike|scallops?|cod|tilapia|perch|crappies?|crab|lobster|tuna|trout|halibut)\b/i],
  ["Poultry", /\b(chicken|turkey|pheasant|drumsticks?|thighs?|duck|wings?|grouse)\b/i],
  ["Pork", /\b(pork|ham|cutlets?|chops?|tenderloin|loin)\b/i],
  ["Beef", /\b(beef|ribeyes?|steaks?|roasts?|sirloin|round|brisket|hamburgers?|burgers?|patties|venison|ground|ribs?|chuck|t-?bone)\b/i],
  ["Meals & sides", /\b(soups?|tortellini|lasagna|casseroles?|chili|pasta|ravioli|meals?|leftovers?|pizzas?|stew|pierogi|dumplings?|fries|tots)\b/i],
  ["Breads", /\b(buns?|muffins?|breads?|tortillas?|bagels?|rolls?|dough|waffles?|pancakes?|croissants?)\b/i],
  ["Fruit & veg", /\b(pears?|corn|rhubarb|beans?|spinach|peas|berr(y|ies)|strawberr(y|ies)|blueberr(y|ies)|raspberr(y|ies)|fruit|vegetables?|veggies?|broccoli|peppers?|carrots?|peach(es)?|apples?|cherr(y|ies)|zucchini|squash|mango)\b/i],
  ["Cheese & dairy", /\b(cheese|mozzarella|cheddar|colby|jack|parmesan|provolone|swiss|butter|ice cream|cream)\b/i]
];
const FZ_ORDER = ["Beef","Poultry","Pork","Sausage & bacon","Fish & seafood","Meals & sides","Breads","Fruit & veg","Cheese & dairy","Other"];
const FZ_PROTEIN = new Set(["Beef","Poultry","Pork","Sausage & bacon","Fish & seafood"]);
const FZ_UNITS = ["pieces","links","package","bag","lb"];
const FZ_LOCS = (DT.freezerLocations&&DT.freezerLocations.length)?DT.freezerLocations.slice():["Kitchen freezer","Chest freezer"];
const FZ_DTYPE = {freezer_date:"Frozen on", best_if_used_by:"Best by", unspecified:"Label date"};
function fzCat(name){ for(const [c,re] of FZ_CATS) if(re.test(name)) return c; return "Other"; }
function fzGuessPick(name){ const c=fzCat(name); if(!FZ_PROTEIN.has(c)) return "No"; return /\b(bacon|breakfast|pepperoni|salami)\b/i.test(name)?"No":"Yes"; }
function fzIdn(s){ const n=parseInt(s,10); return isNaN(n)?Infinity:n; }
function fzNum(v){ const s=String(v==null?"":v).trim().replace(/\.$/,""); return s; }

/* ---------- optimistic edits ---------- */
function fzEdits(){
  const out={};
  for(const [k,e] of Object.entries(FZ.applied)){ if(Date.now()-e.t<FZ_APPLIED_MS) out[k]=e; else delete FZ.applied[k]; }
  for(const [k,e] of Object.entries(FZ.q)) out[k]=e;
  return Object.values(out).sort((a,b)=>(a.at||0)-(b.at||0));
}
function fzFieldsTo(v,f){ v[1]=f.item; v[2]=f.pickday; v[4]=f.label; v[5]=f.qty; v[6]=f.unit; v[7]=f.weight; v[8]=f.loc; v[9]=f.dtype; v[10]=f.prep; v[13]=f.notes; if(f.status) v[3]=f.status; }
function fzApplyEdits(rows){
  const edits=fzEdits(); if(!edits.length) return rows;
  rows=rows.map(x=>({...x, v:x.v.slice()}));
  const byId=id=>rows.find(x=>x.v[0]===id);
  for(const e of edits){
    const ids=e.ids||[];
    if(e.op==="add"){ for(const id of ids){ if(byId(id)) continue; const v=pad([id],15); fzFieldsTo(v,e.f||{}); v[3]="In freezer"; rows.push({v, idx:-1, pending:true, isNew:true}); } }
    else if(e.op==="edit"){ for(const id of ids){ const r=byId(id); if(r){ fzFieldsTo(r.v,e.f||{}); r.pending=true; } } }
    else if(e.op==="remove"){ if(e.how==="delete") rows=rows.filter(x=>!ids.includes(x.v[0])); else for(const id of ids){ const r=byId(id); if(r){ r.v[3]="Used up"; r.pending=true; } } }
    else if(e.op==="back"){ for(const id of ids){ const r=byId(id); if(r){ r.v[3]="In freezer"; r.v[11]=""; r.pending=true; } } }
    else if(e.op==="pull"){ for(const p of e.pulls||[]){ const r=byId(p.id); if(r&&r.v[3].trim().toLowerCase()==="in freezer"){ r.v[3]="Removed to thaw"; r.v[11]=e.date||mdyCT(new Date(e.at||Date.now())); r.pending=true; } } }
  }
  return rows;
}

/* ---------- data ---------- */
function fzPkg(x){ const v=x.v; return {id:v[0], item:v[1].trim(), pickday:v[2].trim(), status:v[3].trim(), label:v[4].trim(), qty:fzNum(v[5]), unit:v[6].trim(), weight:fzNum(v[7]), loc:v[8].trim(), dtype:v[9].trim(), prep:v[10].trim(), removed:v[11].trim(), src:v[13].trim(), upd:v[14].trim(), p:parseDate(v[4]), idx:x.idx, pending:!!x.pending, isNew:!!x.isNew}; }
function fzGroupKey(x){ return [x.item.toLowerCase(),x.label,x.loc.toLowerCase(),x.weight,x.qty,x.unit.toLowerCase(),x.prep.toLowerCase(),x.pickday.toLowerCase(),x.dtype,x.status.toLowerCase(),x.removed].join("|"); }
function fzGroups(list){
  const m=new Map();
  for(const x of list){ const k=fzGroupKey(x); let g=m.get(k); if(!g){ g={...x, key:"g"+hash(k), pkgs:[], cat:fzCat(x.item)}; m.set(k,g); } g.pkgs.push(x); if(x.pending) g.pending=true; if(x.isNew) g.isNew=true; }
  for(const g of m.values()){ g.pkgs.sort((a,b)=>fzIdn(a.id)-fzIdn(b.id)||String(a.id).localeCompare(String(b.id))); g.isNew=g.pkgs.every(p=>p.isNew); }
  return [...m.values()].sort((a,b)=>(a.p?a.p.t:9e15)-(b.p?b.p.t:9e15)||a.item.localeCompare(b.item));
}
function fzData(){
  const src=S.live.freezer?S.live.freezer.rows:(S.snaps.freezer?S.snaps.freezer.rows:null); if(!src) return null;
  const sig=Object.keys(FZ.q).join()+"/"+Object.keys(FZ.applied).join()+"/"+todayUTC()+"/"+Math.floor(Date.now()/60000);
  if(FZ.memo&&FZ.memo.src===src&&FZ.memo.sig===sig) return FZ.memo.d;
  const pk=listRows("freezer").map(fzPkg);
  const inF=pk.filter(x=>x.status.toLowerCase()==="in freezer");
  const review=pk.filter(x=>/review/i.test(x.status));
  const cut=todayUTC()-21*864e5;
  const recent=pk.filter(x=>/thaw/i.test(x.status)&&(()=>{ const p=parseDate(x.removed); return p&&p.t>=cut; })());
  const groups=fzGroups(inF), rgroups=fzGroups(review);
  const tgroups=fzGroups(recent).sort((a,b)=>{ const pa=parseDate(a.removed), pb=parseDate(b.removed); return (pb?pb.t:0)-(pa?pa.t:0); });
  const byKey={}; for(const g of [...groups,...rgroups,...tgroups]) byKey[g.key]=g;
  const counts={}; let undated=0; for(const g of groups){ counts[g.cat]=(counts[g.cat]||0)+g.pkgs.length; if(!g.p) undated+=g.pkgs.length; }
  const locCount={}; for(const x of inF){ const l=x.loc||"No place set"; locCount[l]=(locCount[l]||0)+1; }
  const names=[...new Set(pk.map(x=>x.item).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const mainLoc=Object.entries(locCount).sort((a,b)=>b[1]-a[1])[0]; FZ.mainLoc=mainLoc?mainLoc[0]:"";
  const d={pk, inF, groups, rgroups, tgroups, byKey, counts, undated, locCount, names};
  FZ.memo={src, sig, d}; return d;
}
function fzGroupOf(id){ const d=fzData(); if(!d) return null; return [...d.groups,...d.rgroups,...d.tgroups].find(g=>g.pkgs.some(p=>p.id===id))||null; }
/* used by home, the side panel, the pick-day card and the pull payload */
function freezerItems(){
  const d=fzData(); if(!d) return null;
  const all=d.inF.filter(x=>!x.isNew);
  const dated=all.filter(x=>x.p).sort((a,b)=>a.p.t-b.p.t||fzIdn(a.id)-fzIdn(b.id)||String(a.id).localeCompare(String(b.id)));
  const undated=all.filter(x=>!x.p).sort((a,b)=>fzIdn(a.id)-fzIdn(b.id));
  return {dated, undated, all};
}

/* ---------- display helpers ---------- */
function fzAge(label){ const mo=ageMonths(label); return {mo, cls:mo==null?"none":mo<6?"a1":mo<=12?"a2":"a3"}; }
function fzAgeBadge(label,big){
  const a=fzAge(label); if(a.mo==null) return `<span class="fz-age none" aria-hidden="true">${icon("snow",20)}</span>`;
  let n,u; if(a.mo<1){ n=Math.max(0,Math.round(a.mo*30.44)); u=n===1?"day":"days"; } else if(a.mo<24){ n=Math.floor(a.mo); u="mo"; } else { n=(a.mo/12).toFixed(1); u="yr"; }
  return `<span class="fz-age ${a.cls}" aria-hidden="true">${n}<small>${u}</small></span>`;
}
function fzDateText(label){ const p=parseDate(label); if(!p) return ""; return p.y===+ctParts(new Date()).year?shortDate(label):`${shortDate(label)}, ${p.y}`; }
function fzSize(x){ const parts=[]; if(x.weight) parts.push(`${x.weight} lb`); if(x.qty) parts.push(`${x.qty}${x.unit?" "+x.unit:""}`); return parts.join(" · "); }
function fzMeta(g,showLoc){
  const parts=[g.p?fzDateText(g.label):"No date"];
  const sz=fzSize(g); if(sz) parts.push(sz);
  if(/^cooked$/i.test(g.prep)) parts.push("Cooked");
  if(g.loc&&g.loc!==FZ.mainLoc) parts.push(g.loc);
  return parts.join(" · ");
}
function fzSelCount(g){ const ch=S.checks.freezer||{}; return g.pkgs.filter(p=>ch[p.id]).length; }
function fzWait(g){ return g.pending?`<span class="fz-wait">${S.access==="ok"?"Saving to the sheet…":"Not on the sheet yet"}</span>`:""; }
function fzRow(g,o){
  o=o||{}; const n=g.pkgs.length, sel=fzSelCount(g); const pickable=!g.isNew&&g.status.toLowerCase()==="in freezer";
  const mo=fzAge(g.label).mo;
  const aria=`${g.item}${n>1?`, ${n} packages`:""}, ${g.p?"label date "+longDate(g.label):"no date"}${mo!=null?", "+ageLabel(mo)+" old":""}`;
  return `<div class="fz-row${sel?" sel":""}" data-fzrow="${esc(g.key)}">
    <button class="fz-open" type="button" data-fzopen="${esc(g.pkgs[0].id)}" aria-label="${esc(aria)}">${fzAgeBadge(g.label)}<span class="t"><span class="nm"><span>${esc(g.item)}</span>${n>1?`<span class="fz-x">×${n}</span>`:""}</span><span class="mk">${esc(fzMeta(g,o.loc))}</span>${fzWait(g)}</span></button>
    ${pickable&&!o.nopick?`<button class="fz-pick" type="button" data-fzpick="${esc(g.key)}" aria-pressed="${!!sel}" aria-label="${esc(sel?`Take ${g.item} off the thaw list`:`Pull ${g.item} to thaw`)}"><span class="leaf">${LEAFBOX}</span>${sel&&n>1?`<span class="fz-pn">${sel}</span>`:""}</button>`:""}
  </div>`;
}

/* ---------- list view ---------- */
function renderFreezer(){
  const host=document.getElementById("list-freezer"), top=document.getElementById("fz-top"), chips=document.getElementById("fz-chips");
  const d=fzData();
  if(!d){
    top.innerHTML=""; chips.innerHTML="";

      :`<div class="gr-list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;

  }
  const multiLoc=Object.keys(d.locCount).length>1;

  chips.innerHTML=[chip("all","All",d.inF.length),...cats.map(c=>chip(c,c,d.counts[c])),...(d.undated?[chip("undated","No date",d.undated)]:[]),...(multiLoc?Object.keys(d.locCount).sort().map(l=>chip("loc:"+l,l,d.locCount[l])):[])].join("");
  // list
  if(!d.inF.length&&!d.rgroups.length&&!d.tgroups.length){ host.innerHTML=`<div class="empty">${EMPTY_ART}<p>The freezer is empty.</p></div>`; return; }
  const match=g=>(!q||[g.item,g.loc,g.cat,g.src,g.unit].some(s=>String(s).toLowerCase().includes(q)))
    &&(FZ.cat==="all"||(FZ.cat==="undated"?!g.p:FZ.cat.startsWith("loc:")?(g.loc||"No place set")===FZ.cat.slice(4):g.cat===FZ.cat));
  const items=d.groups.filter(match);

  const rv=d.rgroups.filter(g=>!q||g.item.toLowerCase().includes(q));

  if(d.tgroups.length&&FZ.cat==="all"&&!q){
    const n=d.tgroups.reduce((s,g)=>s+g.pkgs.length,0);
    h+=`<details class="fz-recent"${FZ.recentOpen?" open":""}><summary>Pulled to thaw lately <span class="n">${n}</span>${icon("chev",18)}</summary>${d.tgroups.map(g=>`<div class="fz-rrow"><span class="t"><b>${esc(g.item)}${g.pkgs.length>1?` ×${g.pkgs.length}`:""}</b><span>${esc([g.removed?"Pulled "+fzDateText(g.removed):"Pulled",g.p?"dated "+fzDateText(g.label):""].filter(Boolean).join(" · "))}</span>${fzWait(g)}</span><button class="btn small" type="button" data-fzback="${esc(g.key)}">Put back</button></div>`).join("")}</details>`;
  }
  const s=sourceInfo("freezer"); if(s&&s.kind==="snap") h+=`<p class="sub">Showing the freezer from ${esc(s.at?clockCT(s.at):"earlier")}.</p>`;
  host.innerHTML=h;
}

/* ---------- thaw list (shared checks) ---------- */
async function fzSetSel(g,n){
  if(!S.role){ showWelcome(); return; }
  const ch=S.checks.freezer||(S.checks.freezer={}); const now=Date.now(); const ops=[];
  const ok=g.pkgs.filter(p=>!p.isNew);
  const selected=ok.filter(p=>ch[p.id]);
  if(selected.length>n){ for(const p of selected.slice(n)){ delete ch[p.id]; ops.push([checkPath("freezer",p.id),"delete"]); } }
  else { let need=n-selected.length; for(const p of ok){ if(need<=0) break; if(ch[p.id]) continue; const doc={key:p.id, checkedBy:meId(), checkedAt:now, seen:{item:p.item,label:p.label,status:"In freezer"}}; ch[p.id]=doc; ops.push([checkPath("freezer",p.id),"set",doc]); need--; } }
  if(!ops.length) return;
  haptic(10); render(); refreshFzSheet();
  for(const o of ops) await dbWrite(...o);
  const t=Object.keys(ch).length; announce(`${t} on the thaw list`); roomPresence();
}
async function fzClearTray(){ const ch=S.checks.freezer||{}; const ks=Object.keys(ch); for(const k of ks) delete ch[k]; render(); for(const k of ks) await dbWrite(checkPath("freezer",k),"delete"); }

/* ---------- detail sheet ---------- */
function canEditFz(){ return !!S.role && ((S.db&&!S.dbReadOnly) || (S.access==="ok"&&S.mcp)); }
function fzStatusOf(g){ const s=g.status.toLowerCase(); return s==="in freezer"?"in":/review/.test(s)?"review":/thaw/.test(s)?"thaw":"other"; }
function fzSheetBody(g){
  const h=[]; const n=g.pkgs.length; const st=fzStatusOf(g); const mo=fzAge(g.label).mo;
  h.push(`<div class="fz-head">${fzAgeBadge(g.label)}<span class="t"><b>${g.p?esc(longDate(g.label)):"No date on the label"}</b><span>${esc([mo!=null?ageLabel(mo)+" in the freezer":"",n>1?`${n} identical packages`:"1 package"].filter(Boolean).join(" · "))}</span></span></div>`);
  const fri=/^y/i.test(g.pickday)?"Yes":/^n/i.test(g.pickday)?"No":g.pickday?"Not sure":"";

/* ---------- queue + sheet writes ---------- */
let fzChain=Promise.resolve();
function queueFz(e,opts){
  opts=opts||{};
  if(!S.role){ showWelcome(); return Promise.resolve(false); }
  e={...e, by:S.role, at:Date.now()};
  const key=e.op+"-"+e.id;
  const direct=S.access==="ok"&&S.mcp;
  if(S.db&&!S.dbReadOnly){
    FZ.q[key]=e; render(); refreshFzSheet();
    return fzChain=fzChain.then(()=>dbWrite("fzQueue/"+key,"set",e)).then(ok=>{
      if(!ok){ delete FZ.q[key]; render(); refreshFzSheet(); toast("That didn't save. Try again.",4000); return false; }
      if(!direct&&!opts.quiet) setTimeout(()=>toast("Saved. The sheet catches up within the hour.",4500),2700);
      processFzQueue(); return true;
    });
  }
  if(!direct){ toast("Sign in to Claude to save this."); return Promise.resolve(false); }
  FZ.applied[key]={...e,t:Date.now()}; render();
  return fzChain=fzChain.then(()=>withLock("freezer",key,()=>writeFzOp(e))).then(async()=>{ try{ await S.mcp.invalidate(SRV,"get_values"); }catch(x){} return true; }).catch(err=>{ delete FZ.applied[key]; render(); toast((err&&err.userMsg)||"That didn't save. Try again.",4000); return false; });
}
async function processFzQueue(){
  if(FZ.busy||S.access!=="ok"||!S.mcp||!S.db) return;
  const ent=Object.entries(FZ.q).sort((a,b)=>(a[1].at||0)-(b[1].at||0))[0]; if(!ent) return;
  const [key,next]=ent; FZ.busy=true;
  try{
    await withLock("freezer",key,()=>writeFzOp(next));
    FZ.applied[key]={...next,t:Date.now()};
    if(FZ.q[key]&&FZ.q[key].at===next.at){ delete FZ.q[key]; await dbWrite("fzQueue/"+key,"delete"); }
    try{ await S.mcp.invalidate(SRV,"get_values"); }catch(x){}
  }catch(e){
    console.warn("freezer sync failed",e); FZ.busy=false;
    if(e&&e.busy){ clearTimeout(processFzQueue._t); processFzQueue._t=setTimeout(processFzQueue,20000); return; }
    if(e&&e.userMsg&&next.by===S.role) toast(e.userMsg,4000); return;
  }
  FZ.busy=false; render(); setTimeout(processFzQueue,300);
}
function fzDateCell(mdy){ const n=serialOf(mdy); return n==null?cell(mdy||""):{userEnteredValue:{numberValue:n},userEnteredFormat:{numberFormat:{type:"DATE",pattern:"MM/dd/yyyy"}}}; }
function fzNumCell(v){ const n=gNum(v); return n==null?cell(""):{userEnteredValue:{numberValue:n}}; }
const FZ_FIELD_NAMES=[[1,"item","Item"],[2,"pickday",PICK_COL],[4,"label","Label date"],[5,"qty","Quantity"],[6,"unit","Unit"],[7,"weight","Weight"],[8,"loc","Location"],[9,"dtype","Date type"],[10,"prep","Preparation"],[13,"notes","Notes"]];
async function writeFzOp(e){
  if(e.op==="pull") return writePull({batchId:e.id, list:"freezer", person:roleName(e.by), role:e.by, note:"", pulls:e.pulls||[]});
  const id=IDS().freezer; const who=roleName(e.by||S.role); const tag=`(ref ${e.id})`;
  for(let attempt=0; attempt<2; attempt++){
    const meta=await sheetMeta(id); mustHave(meta,["Inventory","Change Log"]);
    const [inv,cl]=await Promise.all([sheetVals(id,"'Inventory'!A:O"), sheetVals(id,"'Change Log'!B:B")]);
    const sI=meta.ids["Inventory"], sC=meta.ids["Change Log"]; const today=mdyCT(new Date());
    const rows=inv.map(r=>pad(r,15)); const rowOf=pid=>rows.findIndex((r,i)=>i>0&&r[0]===pid);
    const req=[], chg=[];
    const F="userEnteredValue,userEnteredFormat.numberFormat";
    const mid=(f,status)=>[cell(f.item),cell(f.pickday),cell(status),f.label?fzDateCell(f.label):cell(""),fzNumCell(f.qty),cell(f.unit||""),fzNumCell(f.weight),cell(f.loc||""),cell(f.dtype||"unspecified"),cell(f.prep||"unspecified")];
    if(e.op==="add"){
      if(rows.some((r,i)=>i>0&&String(r[14]).includes(tag))) return;
      const used=new Set([...rows.slice(1).map(r=>String(r[0]).trim()),...cl.slice(1).map(r=>String((r&&r[0])||"").trim())].filter(Boolean));
      let ids=(e.ids||[]).slice();
      if(!ids.length||ids.some(x=>used.has(x))){ let max=0; for(const x of used){ const k=parseInt(x,10); if(k>max) max=k; } ids=ids.map((_,i)=>String(max+1+i)); if(!ids.length) ids=[String(max+1)]; }
      const f=e.f||{};
      req.push({appendCells:{sheetId:sI, rows:ids.map(nid=>({values:[cell(nid),...mid(f,"In freezer"),cell(""),cell(who),cell(f.notes||""),cell(`Added in Dinner Time by ${who} ${tag}`)]})), fields:F}});
      for(const nid of ids) chg.push([today,nid,"Added","","In freezer",who,`Added in Dinner Time by ${who}: ${f.item}${f.label?` dated ${f.label}`:" (no date)"}${f.loc?`, ${f.loc}`:""}.`]);
    } else if(e.op==="edit"){
      const f=e.f||{};
      for(const pid of e.ids||[]){
        const i=rowOf(pid); if(i<0) continue; const r=rows[i];
        const before=[], after=[];
        for(const [c,k,name] of FZ_FIELD_NAMES){ const o=String(r[c]||"").trim().replace(/\.$/,""), n=String(f[k]||"").trim(); if(c===4?(serialOf(o)!==serialOf(n)):(o!==n)){ before.push(`${name}: ${o||"blank"}`); after.push(`${name}: ${n||"blank"}`); } }
        const status=f.status||r[3]; if(f.status&&f.status!==r[3]){ before.push(`Status: ${r[3]||"blank"}`); after.push(`Status: ${f.status}`); }
        if(!before.length) continue;
        req.push({updateCells:{start:{sheetId:sI,rowIndex:i,columnIndex:1}, rows:[{values:mid(f,status)}], fields:F}});
        req.push({updateCells:{start:{sheetId:sI,rowIndex:i,columnIndex:13}, rows:[{values:[cell(f.notes||""),cell(`Edited in Dinner Time by ${who} on ${today}.`)]}], fields:"userEnteredValue"}});
        chg.push([today,pid,"Edited",before.join("; "),after.join("; "),who,`Edited in Dinner Time by ${who}.`]);
      }
    } else if(e.op==="remove"){
      if(e.how==="delete"){
        const idx=(e.ids||[]).map(rowOf).filter(i=>i>0).sort((a,b)=>b-a);
        for(const i of idx){ const r=rows[i]; req.push({deleteDimension:{range:{sheetId:sI,dimension:"ROWS",startIndex:i,endIndex:i+1}}}); chg.push([today,r[0],"Deleted",r[3]||"",`Entry removed`,who,`Erased in Dinner Time by ${who} (added by mistake): ${r[1]}${r[4]?` dated ${r[4]}`:""}. ID retired, not reused.`]); }
      } else {
        for(const pid of e.ids||[]){ const i=rowOf(pid); if(i<0||rows[i][3]==="Used up") continue; const r=rows[i];
          req.push({updateCells:{start:{sheetId:sI,rowIndex:i,columnIndex:3}, rows:[rowData(["Used up"])], fields:"userEnteredValue"}});
          req.push({updateCells:{start:{sheetId:sI,rowIndex:i,columnIndex:14}, rows:[rowData([`Marked used or tossed in Dinner Time by ${who} on ${today}.`])], fields:"userEnteredValue"}});
          chg.push([today,pid,"Used up",r[3]||"","Used up",who,`Used or tossed, from Dinner Time by ${who}: ${r[1]}${r[4]?` dated ${r[4]}`:""}.`]); }
      }
    } else if(e.op==="back"){
      for(const pid of e.ids||[]){ const i=rowOf(pid); if(i<0||rows[i][3]==="In freezer") continue; const r=rows[i];
        req.push({updateCells:{start:{sheetId:sI,rowIndex:i,columnIndex:3}, rows:[rowData(["In freezer"])], fields:"userEnteredValue"}});
        req.push({updateCells:{start:{sheetId:sI,rowIndex:i,columnIndex:11}, rows:[rowData([""])], fields:"userEnteredValue"}});
        req.push({updateCells:{start:{sheetId:sI,rowIndex:i,columnIndex:14}, rows:[rowData([`Put back in the freezer from Dinner Time by ${who} on ${today}.`])], fields:"userEnteredValue"}});
        chg.push([today,pid,"Returned to freezer",r[3]||"","In freezer",who,`Put back from Dinner Time by ${who}: ${r[1]}${r[4]?` dated ${r[4]}`:""}.`]); }
    }
    if(!req.length) return;
    if(chg.length) req.push({appendCells:{sheetId:sC, rows:chg.map(rowData), fields:"userEnteredValue"}});
    try{ await callS("update_spreadsheet",{spreadsheetId:id, requests:req, writeControl:{requiredRevisionId:meta.rev}}); }
    catch(err){
      if(isStale(err)&&attempt===0) continue;
      if(isStale(err)) throw {userMsg:"The freezer sheet was busy. It'll try again shortly."};
      if(outcomeUnknown(err)&&e.op==="add"){ const v=await sheetVals(id,"'Inventory'!O:O").catch(()=>[]); if(v.some(r=>String(r[0]||"").includes(tag))) return; }
      throw accessFail(err);
    }
    return;
  }
}

async function dbWrite(path, op, data){
  if(!S.db) { toast("Sign in to Claude to share checks."); return false; }
  try{ const ref=S.db.doc(path); if(op==="set") await ref.set(data); else if(op==="delete") await ref.delete(); else await ref.update(data); outboxDrop(path); return true; }
  catch(e){
    if(e&&e.code==="invalid_argument"&&op!=="update"){ S.dbReadOnly=true; render(); return false; }
    if(e&&(e.code==="unavailable"||!e.code)){ outboxPut(path,op,data); return true; }
    if(e&&e.code==="quota_exceeded"){ toast("The shared list is full. Save to the sheet to make room."); return false; }
    toast("That change didn't go through. Try again."); return false;
  }
}
function outboxPut(path,op,data){ const o=lsGet("dt.outbox",{}); o[path]={op,data,at:Date.now()}; lsSet("dt.outbox",o); }
function outboxDrop(path){ const o=lsGet("dt.outbox",{}); if(o[path]){ delete o[path]; lsSet("dt.outbox",o); } }

async function outboxFlush(){ if(flushing||!S.db) return; flushing=true; try{ const o=lsGet("dt.outbox",{}); for(const [p,w] of Object.entries(o)){ try{ const ref=S.db.doc(p); if(w.op==="set") await ref.set(w.data); else if(w.op==="delete") await ref.delete(); outboxDrop(p); }catch(e){ if(!(e&&e.code==="unavailable")) outboxDrop(p); break; } } } finally{ flushing=false; } }

let sheetState=null;
function openSheet({title,body,foot,mount,focus,locked,swipe,full}){
  closeSheet(true);

  root.innerHTML=`<div class="scrim" data-scrim></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title"><div class="handle"></div><div class="sh-head"><h2 id="sh-title">${esc(title)}</h2>${locked?"":`<button class="editbtn" data-close aria-label="Close">${icon("x")}</button>`}</div><div class="sh-body">${body}</div>${foot?`<div class="sh-foot">${foot}</div>`:""}</div>`;

const KB=(()=>{
  const R=document.documentElement, vv=window.visualViewport, android=/Android/i.test(navigator.userAgent);
  if(android) R.classList.add("android");
  const isText=t=>t&&(t.tagName==="TEXTAREA"||(t.tagName==="INPUT"&&!/^(checkbox|radio|button|submit|range|file|color)$/i.test(t.type)));
  let baseH=innerHeight, wasUp=false;
  addEventListener("orientationchange",()=>setTimeout(()=>{ if(!R.classList.contains("kb-top")) baseH=innerHeight; measure(); },400));
  function measure(){
    if(!android) return;
    const h=vv?vv.height:innerHeight, top=vv?vv.offsetTop:0, kb=Math.max(0,Math.round(innerHeight-h-top));
    if(!R.classList.contains("kb-top")||innerHeight>baseH) baseH=Math.max(baseH,innerHeight);
    R.classList.toggle("kb-resized",baseH-h>150);
    R.style.setProperty("--vvh",Math.round(h)+"px");
    R.style.setProperty("--kb",(kb>80?kb:0)+"px");
    R.classList.toggle("kb-measured",kb>80);
    const up=R.classList.contains("kb-resized")||kb>80;
    if(wasUp&&!up&&R.classList.contains("kb-top")){ R.classList.remove("kb-top"); const a=document.activeElement; if(isText(a)) try{ a.blur(); }catch(_){} }
    wasUp=up;
    if(R.classList.contains("sheet-open")&&(scrollX||(vv&&vv.offsetLeft))) scrollTo(0,scrollY); // undo sideways pan
  }
  if(vv){ vv.addEventListener("resize",measure); vv.addEventListener("scroll",measure); }
  addEventListener("resize",measure);
  document.addEventListener("focusin",e=>{
    if(!android||!isText(e.target)||!e.target.closest(".sheet")) return;
    R.classList.add("kb-top"); measure();
    setTimeout(()=>{ measure(); try{ e.target.scrollIntoView({block:"nearest"}); }catch(_){} },350);
  });
  document.addEventListener("focusout",()=>{
    setTimeout(()=>{ if(!isText(document.activeElement)) R.classList.remove("kb-top"); measure(); },120);
  });
  measure();
  return {open(){ R.classList.add("sheet-open"); }, close(){ R.classList.remove("sheet-open","kb-top"); }};
})();
function sheetClick(e){ if(sheetState&&sheetState.locked) return; if(e.target.closest("[data-close]")||e.target.matches("[data-scrim]")) closeSheet(); }
function closeSheet(instant){
  const root=document.getElementById("sheetroot"); if(!sheetState){ root.innerHTML=""; return; }
  const {el,prev}=sheetState; sheetState=null; root.removeEventListener("click",sheetClick); KB.close();
  if(instant){ root.innerHTML=""; return; }
  el.classList.remove("show"); const sc=root.querySelector(".scrim"); if(sc) sc.classList.remove("show");
  setTimeout(()=>{ if(!sheetState) root.innerHTML=""; },330);
  if(prev&&prev.focus) try{ prev.focus({preventScroll:true}); }catch(e){}
}
addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheetState&&!sheetState.locked) closeSheet(); });
/* Pull down to close: a downward drag that STARTS with the content already at the top
   (or on the handle / title) moves the sheet with the finger; let go past ~90px, or
   with a quick flick, and it closes. Scrolling up to the top never closes by itself —
   it takes a second, fresh pull. Phones and tablets in portrait only. */
function swipeToClose(el){
  const body=el.querySelector(".sh-body"); if(!body) return;
  const mq=matchMedia("(max-width:1023px)");
  let y0=0, x0=0, t0=0, dy=0, armed=false, drag=false;
  const set=v=>{ dy=Math.max(0,v); el.style.setProperty("--dy",dy+"px"); const sc=document.querySelector("#sheetroot .scrim"); if(sc) sc.style.opacity=String(Math.max(.15,1-dy/400)); };
  el.addEventListener("touchstart",e=>{
    if(!mq.matches||e.touches.length!==1||!sheetState||sheetState.el!==el) return;
    const t=e.target; if(t.closest("input,textarea,select,.gr-photos,.rx-chips,.tn-chips")) { armed=false; return; }
    const onTop=t.closest(".handle,.sh-head");
    armed=!!onTop || body.scrollTop<=0;
    y0=e.touches[0].clientY; x0=e.touches[0].clientX; t0=performance.now(); drag=false; dy=0;
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    if(!armed) return;
    const d=e.touches[0].clientY-y0, dx=Math.abs(e.touches[0].clientX-x0);
    if(!drag){
      if(d<=0 || dx>Math.abs(d)){ if(Math.abs(d)>6||dx>6) armed=false; return; }   // scrolling up or sideways: leave it alone
      if(body.scrollTop>0&&!e.target.closest(".handle,.sh-head")){ armed=false; return; }
      if(e.cancelable) e.preventDefault();   // pulling down at the top: keep the browser from starting its own scroll
      if(d<8) return;
      drag=true; el.classList.add("dragging"); y0+=8;
    }
    e.preventDefault(); set(e.touches[0].clientY-y0);
  },{passive:false});
  const end=()=>{
    if(!drag){ armed=false; return; }
    const v=dy/Math.max(1,performance.now()-t0);
    drag=false; armed=false; el.classList.remove("dragging");
    if(dy>90 || (v>.6&&dy>30)){ haptic(8); closeSheet(); requestAnimationFrame(()=>el.style.removeProperty("--dy")); }
    else { set(0); const sc=document.querySelector("#sheetroot .scrim"); if(sc) sc.style.opacity=""; }
  };
  el.addEventListener("touchend",end); el.addEventListener("touchcancel",end);
}

function newBatchId(list){ const d=new Date(); return list==="freezer" ? `THAW-${compactCT(d)}` : `${LISTS[list].batch}-${compactCT(d)}-${b32(4)}`; }

function quickSave(list,opts){

function buildPayload(list,{addIds}){
  const batchId=newBatchId(list); const base={batchId,list,person:roleName(S.role),role:S.role,note:""};
  const q=queuedKeys(list);
  if(list==="freezer"){ const f=freezerItems(); if(!f) return null; const sel=S.checks.freezer||{}; const pulls=f.all.filter(x=>sel[x.id]&&!q.has(x.id)).map(x=>({id:x.id,item:x.item,label:x.label,checkedBy:sel[x.id].checkedBy})); return pulls.length?{...base,pulls}:null; }
  const rows=listRows(list)||[]; const ch=S.checks[list]||{};

}
async function doQuick(P){

    toast(resultText(P,res), (res.skipped&&res.skipped.length)?5000:2600);

function resultText(P,res){
  if(res.queued) return "Saved here. It reaches the sheet when a phone that can opens Dinner Time!.";
  if(res.fzQueued) return `Out to thaw: ${res.pulled.length}. The sheet catches up within the hour.`;
  const a=(res.added||[]).length, r=(res.removed||[]).length, p=(res.pulled||[]).length, sk=res.skipped||[];
