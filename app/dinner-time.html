}
function openIdea(optId){
  const r=ideaRow(optId); if(!r) return;
  openSheet({title:r[3], body:`<p class="sub">${esc(r[1])} · ${esc(r[2])}</p>${tnOpt(r).replace('<details class="tn-opt"','<details open class="tn-opt"')}`, swipe:true, focus:"[data-close]"});
}
function ideaText(r){
  const ing=String(r[7]).split(/;\s*/).map(s=>s.trim()).filter(Boolean);
  const steps=String(r[8]).split(/(?:^|\s+)(?=\d{1,2}\.\s)/).map(s=>s.replace(/^\d{1,2}\.\s*/,"").trim()).filter(Boolean);
  const meta=[r[4]?`${r[4]} servings`:"", parseInt(r[5],10)?`${tnMin(parseInt(r[5],10))} prep`:"", parseInt(r[6],10)?`${tnMin(parseInt(r[6],10))} cook`:""].filter(Boolean).join(" · ");
  const parts=[];
  if(meta) parts.push(meta);
  if(ing.length) parts.push("Ingredients\n"+ing.map(x=>"- "+x).join("\n"));
  if(steps.length) parts.push("Steps\n"+steps.map((x,i)=>`${i+1}. ${x}`).join("\n"));
  if(r[11]) parts.push("Equipment: "+r[11]);
  if(r[12]) parts.push("Notes: "+r[12]);

}
const CAT_SYN={beef:["beef","steak","ribeye","sirloin","brisket","chuck","roast beef","short rib","ribs"],chicken:["chicken","thigh","breast","drumstick","wing"],pork:["pork","ham","bacon","brat","sausage","tenderloin","chop"],fish:["fish","walleye","salmon","cod","pike","bluegill","perch","tilapia","trout"],seafood:["shrimp","scallop","crab","lobster","seafood"],turkey:["turkey"],venison:["venison"]};
function suggestCats(r){
  const hay=" "+(String(r[1])+" "+String(r[3])).toLowerCase()+" ";
  return allCats().filter(c=>{ const n=String(c[1]).toLowerCase().trim().replace(/s$/,""); const words=CAT_SYN[n]||(n.length>2?[n]:[]);
    return words.some(w=>new RegExp("[^a-z]"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"s?[^a-z]").test(hay)); }).map(c=>c[0]);
}

}

async function submitBug(row){
  row=row.slice();
  const kind=/ \((concern|observation)\)$/.exec(row[3]);
  row[3]="App page: "+(BUG_PAGES[S.view]||S.view||"App")+(kind?kind[0]:"");
  if(BUG_SHEET && S.mcp && S.access==="ok"){
    try{
      const meta=await sheetMeta(BUG_SHEET);
      if(meta.ids["Bugs"]!=null){
        row[0]=DinnerTimeBugReport.nextBugId((await sheetVals(BUG_SHEET,"'Bugs'!A:A")).map(r=>r[0]));
        await callS("update_spreadsheet",{spreadsheetId:BUG_SHEET, requests:[{appendCells:{sheetId:meta.ids["Bugs"], rows:[rowData(row)], fields:"userEnteredValue"}}]});
        return;
      }
    }catch(e){ console.warn("bug report: direct write failed, queueing", e); }
  }
  if(!S.db) throw new Error("not signed in");
  row[0]="";
  const ok=await dbWrite("bugQueue/bug-"+Date.now()+"-"+rid(4),"set",{row, by:S.role||"", at:Date.now()});
  if(!ok) throw new Error("couldn't save");
}

async function boot(){
  { const v=document.getElementById("appver"); if(v) v.textContent=`${DT.appTitle} · version ${BUILD}`; }
  document.documentElement.style.setProperty("--season",season().accent);
  const cachedRole=lsGet("dt.role",null); if(cachedRole&&PERSON[cachedRole]){ S.role=cachedRole; document.documentElement.dataset.role=cachedRole; }
  const h=location.hash.slice(1); go(VIEWS.includes(h)?h:"home");
  if((!window.claude||!window.claude.use) && DT.bridge && DT.bridge.url) window.claude=DTBridgeRuntime(DT.bridge);
  if(!window.claude||!window.claude.use){ S.access="none"; render(); try{ mountBugHost(); }catch(e){} return; }
  const [db,user,mcp,room,perms]=await Promise.all(["db","user","mcp","room","permissions"].map(n=>window.claude.use(n).catch(()=>null)));
  S.db=db; S.user=user; S.mcp=mcp; S.room=room; S.perms=perms;
  if(user){ try{ S.isOwner=await user.isOwner(); }catch(e){} try{ S.uid=await user.id(); }catch(e){} try{ const w=await user.can("data.write"); if(w===false) S.dbReadOnly=true; }catch(e){} }
  if(db){ Hero.watch(db); startDb(); startRecipeDb(); startGearDb(); startFzDb(); startMenuDb(); } else { S.dbReady=true; resolveRole(); }
  if(!db && !S.role) showWelcome();
  if(room) startRoom();
  if(mcp) connectSheets(false); else { S.access="none"; render(); }
  if(!S.uid) resolveRole();
  outboxFlush();
  render();
  try{ mountBugHost(); DinnerTimeBugReport.init({tileSelector:"#bugHost", getUser:()=>S.role?roleName(S.role):"", getBuild:()=>BUILD, timeZone:TZ, submit:submitBug}); }catch(e){ console.warn("bug report button",e); }
}
boot();
</script>
</html>
